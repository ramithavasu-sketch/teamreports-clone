erflow-hidden shadow-xs\">\n        <div className=\"p-4 border-b border-slate-200 flex items-center justify-between\">\n          <div>\n            <h3 className=\"text-sm font-semibold text-slate-900\">\n              Associate Performance & Review Audit Summary\n            <\/h3>\n            <p className=\"text-xs text-slate-500 mt-0.5\">\n              QA findings aggregated by CX Associate\n            <\/p>\n          <\/div>\n        <\/div>\n\n        <div className=\"overflow-x-auto\">\n          <table className=\"w-full text-left border-collapse text-xs\">\n            <thead>\n              <tr className=\"bg-slate-50 border-b border-slate-200 text-[11px] font-semibold text-slate-500 uppercase tracking-wider\">\n                <th className=\"py-3 px-4\">Associate Name<\/th>\n                <th className=\"py-3 px-4\">Team<\/th>\n                <th className=\"py-3 px-4\">Calls Screened<\/th>\n                <th className=\"py-3 px-4\">Short Calls (\u226430s)<\/th>\n                <th className=\"py-3 px-4\">Reviewed<\/th>\n                <th className=\"py-3 px-4\">Confirmed Issues<\/th>\n                <th className=\"py-3 px-4\">Dismissed (FP)<\/th>\n                <th className=\"py-3 px-4 text-right\">False Positive %<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody className=\"divide-y divide-slate-100\">\n              {agentSummaries.map((agent) => {\n                const fpRate = agent.reviewed > 0 \n                  ? Math.round((agent.dismissed / agent.reviewed) * 100) \n                  : 0;\n\n                return (\n                  <tr key={agent.agentName} className=\"hover:bg-slate-50 transition-colors\">\n                    <td className=\"py-3 px-4 font-medium text-slate-800\">\n                      {agent.agentName}\n                    <\/td>\n                    <td className=\"py-3 px-4 text-slate-500\">\n                      {agent.team}\n                    <\/td>\n                    <td className=\"py-3 px-4 font-mono\">\n                      {agent.total}\n                    <\/td>\n                    <td className=\"py-3 px-4 font-mono text-amber-600 font-semibold\">\n                      {agent.shortCalls}\n                    <\/td>\n                    <td className=\"py-3 px-4 font-mono\">\n                      {agent.reviewed} / {agent.total}\n                    <\/td>\n                    <td className=\"py-3 px-4 font-mono font-semibold text-rose-600\">\n                      {agent.confirmed}\n                    <\/td>\n                    <td className=\"py-3 px-4 font-mono text-emerald-600 font-semibold\">\n                      {agent.dismissed}\n                    <\/td>\n                    <td className=\"py-3 px-4 font-mono text-right text-slate-600\">\n                      {fpRate}%\n                    <\/td>\n                  <\/tr>\n                );\n              })}\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n};\n", "src/components/settings/SettingsView.tsx": "import React, { useState } from 'react';\nimport { useCallContext } from '../../context/CallContext';\nimport { \n  Sliders, \n  Check, \n  RotateCcw, \n  ShieldAlert, \n  Sparkles, \n  Info, \n  CheckCircle2, \n  Terminal,\n  Volume2\n} from 'lucide-react';\nimport { ScreeningSettings } from '../../types';\n\nexport const SettingsView: React.FC = () => {\n  const { \n    settings, \n    updateSettings, \n    rescreenAllCalls, \n    resetDemoData \n  } = useCallContext();\n\n  const [formSettings, setFormSettings] = useState<ScreeningSettings>(settings);\n  const [testPhrase, setTestPhrase] = useState('Thank you for calling Apex Support, this is Maya, how may I help you?');\n  const [testTimestamp, setTestTimestamp] = useState<number>(3.2);\n  const [savedSuccess, setSavedSuccess] = useState(false);\n\n  const handleSave = (e: React.FormEvent) => {\n    e.preventDefault();\n    updateSettings(formSettings);\n    rescreenAllCalls();\n    setSavedSuccess(true);\n    setTimeout(() => setSavedSuccess(false), 3000);\n  };\n\n  // Live test matching logic\n  const isPhraseCompliant = \n    testPhrase.toLowerCase().includes('thank you for calling') &&\n    testPhrase.toLowerCase().includes('support') &&\n    testTimestamp <= formSettings.answerPhraseDeadlineSeconds;\n\n  return (\n    <div className=\"p-8 max-w-4xl mx-auto space-y-8\">\n      {/* Title */}\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200\">\n        <div>\n          <h1 className=\"text-2xl font-bold tracking-tight text-slate-900\">\n            Screening Rules & Thresholds\n          <\/h1>\n          <p className=\"text-sm text-slate-500 mt-1\">\n            Configure automated screening heuristics, answer phrase deadlines, and audio quality tolerances.\n          <\/p>\n        <\/div>\n\n        <button\n          onClick={resetDemoData}\n          className=\"inline-flex items-center gap-1.5 px-3 py-1.5 text-xs text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors self-start sm:self-center\"\n        >\n          <RotateCcw className=\"w-3.5 h-3.5\" />\n          <span>Reset Defaults<\/span>\n        <\/button>\n      <\/div>\n\n      <form onSubmit={handleSave} className=\"space-y-6\">\n        {/* Card 1: Short-Call & Answer Phrase Benchmarks */}\n        <div className=\"bg-white border border-slate-200 rounded-lg p-6 space-y-5 shadow-xs\">\n          <div>\n            <h2 className=\"text-base font-semibold text-slate-900\">\n              1. Duration & Greeting Benchmarks\n            <\/h2>\n            <p className=\"text-xs text-slate-500 mt-0.5\">\n              Standards for customer interaction initiation and length\n            <\/p>\n          <\/div>\n\n          <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n            {/* Short Call Threshold */}\n            <div className=\"space-y-2\">\n              <div className=\"flex justify-between items-center text-xs\">\n                <label className=\"font-semibold text-slate-800\">\n                  Short-Call Flagging Threshold:\n                <\/label>\n                <span className=\"font-mono font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded\">\n                  {formSettings.shortCallThresholdSeconds} seconds\n                <\/span>\n              <\/div>\n              <input\n                type=\"range\"\n                min=\"10\"\n                max=\"60\"\n                step=\"5\"\n                value={formSettings.shortCallThresholdSeconds}\n                onChange={(e) => setFormSettings(prev => ({ \n                  ...prev, \n                  shortCallThresholdSeconds: parseInt(e.target.value) \n                }))}\n                className=\"w-full accent-indigo-600\"\n              />\n              <p className=\"text-[11px] text-slate-500\">\n                Calls completed within {formSettings.shortCallThresholdSeconds}s are flagged for rapid disconnect or premature termination screening.\n              <\/p>\n            <\/div>\n\n            {/* Answer Phrase Deadline */}\n            <div className=\"space-y-2\">\n              <div className=\"flex justify-between items-center text-xs\">\n                <label className=\"font-semibold text-slate-800\">\n                  Answer Phrase Deadline:\n                <\/label>\n                <span className=\"font-mono font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded\">\n                  {formSettings.answerPhraseDeadlineSeconds} seconds\n                <\/span>\n              <\/div>\n              <input\n                type=\"range\"\n                min=\"2\"\n                max=\"10\"\n                step=\"1\"\n                value={formSettings.answerPhraseDeadlineSeconds}\n                onChange={(e) => setFormSettings(prev => ({ \n                  ...prev, \n                  answerPhraseDeadlineSeconds: parseInt(e.target.value) \n                }))}\n                className=\"w-full accent-indigo-600\"\n              />\n              <p className=\"text-[11px] text-slate-500\">\n                Associates must utter the required brand greeting within the first {formSettings.answerPhraseDeadlineSeconds}s of the call connection.\n              <\/p>\n            <\/div>\n          <\/div>\n\n          {/* Required Answer Phrase Template */}\n          <div className=\"space-y-2 pt-2 border-t border-slate-100\">\n            <label className=\"block text-xs font-semibold text-slate-800\">\n              Required Brand Greeting Template:\n            <\/label>\n            <input\n              type=\"text\"\n              value={formSettings.requiredAnswerPhrase}\n              onChange={(e) => setFormSettings(prev => ({ ...prev, requiredAnswerPhrase: e.target.value }))}\n              className=\"w-full text-xs bg-slate-50 border border-slate-200 rounded p-2 text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 font-mono\"\n            />\n            <p className=\"text-[11px] text-slate-500\">\n              Pattern matching allows transcription variance, phoneme phonetic equivalence, and personal associate name tokens.\n            <\/p>\n          <\/div>\n        <\/div>\n\n        {/* Card 2: Audio Quality Tolerances */}\n        <div className=\"bg-white border border-slate-200 rounded-lg p-6 space-y-5 shadow-xs\">\n          <div>\n            <h2 className=\"text-base font-semibold text-slate-900\">\n              2. Audio Quality & Telephony Criteria\n            <\/h2>\n            <p className=\"text-xs text-slate-500 mt-0.5\">\n              Automated acoustic screening thresholds for background chatter, echo, and VOIP jitter\n            <\/p>\n          <\/div>\n\n          <div className=\"space-y-4\">\n            {/* Background Noise Toggle & SNR slider */}\n            <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200\">\n              <div>\n                <label className=\"text-xs font-semibold text-slate-800 flex items-center gap-2\">\n                  <input\n                    type=\"checkbox\"\n                    checked={formSettings.flagBackgroundNoise}\n                    onChange={(e) => setFormSettings(prev => ({ ...prev, flagBackgroundNoise: e.target.checked }))}\n                    className=\"accent-indigo-600 rounded\"\n                  />\n                  <span>Flag Excessive Background Noise<\/span>\n                <\/label>\n                <p className=\"text-[11px] text-slate-500 mt-0.5 ml-5\">\n                  Flags call floor chatter, sirens, or TV playback on associate line.\n                <\/p>\n              <\/div>\n\n              <div className=\"flex items-center gap-2 text-xs\">\n                <span className=\"text-slate-600\">Min SNR:<\/span>\n                <span className=\"font-mono font-semibold text-slate-800 bg-white border border-slate-200 px-2 py-0.5 rounded\">\n                  {formSettings.noiseSnrThresholdDb} dB\n                <\/span>\n              <\/div>\n            <\/div>\n\n            {/* Echo Detection Toggle */}\n            <div className=\"flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200\">\n              <div>\n                <label className=\"text-xs font-semibold text-slate-800 flex items-center gap-2\">\n                  <input\n                    type=\"checkbox\"\n                    checked={formSettings.flagEcho}\n                    onChange={(e) => setFormSettings(prev => ({ ...prev, flagEcho: e.target.checked }))}\n                    className=\"accent-indigo-600 rounded\"\n                  />\n                  <span>Flag Acoustic Echo & Speaker Bleed<\/span>\n                <\/label>\n                <p className=\"text-[11px] text-slate-500 mt-0.5 ml-5\">\n                  Detects acoustic feedback loop when associate open speakers bleed into microphone.\n                <\/p>\n              <\/div>\n            <\/div>\n\n            {/* Choppy / Packet Loss Slider */}\n            <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200\">\n              <div>\n                <label className=\"text-xs font-semibold text-slate-800 flex items-center gap-2\">\n                  <input\n                    type=\"checkbox\"\n                    checked={formSettings.flagChoppyAudio}\n                    onChange={(e) => setFormSettings(prev => ({ ...prev, flagChoppyAudio: e.target.checked }))}\n                    className=\"accent-indigo-600 rounded\"\n                  />\n                  <span>Flag VOIP Choppiness & RTP Packet Loss<\/span>\n                <\/label>\n                <p className=\"text-[11px] text-slate-500 mt-0.5 ml-5\">\n                  Flags jitter buffer overflow and robotic voice distortion.\n                <\/p>\n              <\/div>\n\n              <div className=\"flex items-center gap-2 text-xs\">\n                <span className=\"text-slate-600\">Choppiness limit:<\/span>\n                <span className=\"font-mono font-semibold text-slate-800 bg-white border border-slate-200 px-2 py-0.5 rounded\">\n                  &gt;{formSettings.choppinessThreshold}%\n                <\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        {/* Card 3: QA Safeguard & Policy Rules */}\n        <div className=\"bg-white border border-slate-200 rounded-lg p-6 space-y-4 shadow-xs\">\n          <div>\n            <h2 className=\"text-base font-semibold text-slate-900\">\n              3. Intentional Disconnect Safeguard Policy\n            <\/h2>\n            <p className=\"text-xs text-slate-500 mt-0.5\">\n              Compliance mandate prohibiting automated presumption of misconduct\n            <\/p>\n          <\/div>\n\n          <div className=\"p-4 bg-indigo-50/70 border border-indigo-200 rounded-lg space-y-2 text-xs\">\n            <div className=\"flex items-center gap-2\">\n              <ShieldAlert className=\"w-4 h-4 text-indigo-700 shrink-0\" />\n              <label className=\"font-semibold text-indigo-900 flex items-center gap-2\">\n                <input\n                  type=\"checkbox\"\n                  checked={formSettings.requireHumanConfirmationForDisconnect}\n                  onChange={(e) => setFormSettings(prev => ({ \n                    ...prev, \n                    requireHumanConfirmationForDisconnect: e.target.checked \n                  }))}\n                  className=\"accent-indigo-600 rounded\"\n                />\n                <span>Enforce Mandatory Human Decision for Potential Disconnects<\/span>\n              <\/label>\n            <\/div>\n            <p className=\"text-indigo-800 text-[11px] leading-relaxed pl-6\">\n              When checked, AI will categorize disconnect events with \"Advisory / Inconclusive\" status until a QA human confirms associate release vs. carrier SIP failure. <strong>Call duration alone must never be treated as proof of intentional disconnection.<\/strong>\n            <\/p>\n          <\/div>\n        <\/div>\n\n        {/* Card 4: Interactive Live Testing Sandbox */}\n        <div className=\"bg-white border border-slate-200 rounded-lg p-6 space-y-4 shadow-xs\">\n          <div className=\"flex items-center justify-between\">\n            <div>\n              <h2 className=\"text-base font-semibold text-slate-900\">\n                4. Greeting Matcher Testing Sandbox\n              <\/h2>\n              <p className=\"text-xs text-slate-500 mt-0.5\">\n                Simulate speech recognition input against current configured rules\n              <\/p>\n            <\/div>\n            <span className=\"text-xs font-mono text-slate-400\">TEST CONSOLE<\/span>\n          <\/div>\n\n          <div className=\"space-y-3\">\n            <div>\n              <label className=\"block text-xs font-semibold text-slate-700 mb-1\">\n                Sample Associate Utterance:\n              <\/label>\n              <input\n                type=\"text\"\n                value={testPhrase}\n                onChange={(e) => setTestPhrase(e.target.value)}\n                className=\"w-full text-xs bg-slate-50 border border-slate-200 rounded p-2 text-slate-800 font-mono\"\n              />\n            <\/div>\n\n            <div className=\"flex items-center gap-4 text-xs\">\n              <div className=\"flex items-center gap-2\">\n                <span className=\"font-medium text-slate-700\">Timestamp Spoken:<\/span>\n                <input\n                  type=\"number\"\n                  step=\"0.1\"\n                  min=\"0\"\n                  max=\"15\"\n                  value={testTimestamp}\n                  onChange={(e) => setTestTimestamp(parseFloat(e.target.value))}\n                  className=\"w-20 bg-slate-50 border border-slate-200 rounded p-1 text-slate-800 font-mono\"\n                />\n                <span className=\"text-slate-400\">sec<\/span>\n              <\/div>\n            <\/div>\n\n            {/* Live Result Output */}\n            <div className={`p-3 rounded-lg border text-xs flex items-center justify-between ${\n              isPhraseCompliant \n                ? 'bg-emerald-50 border-emerald-200 text-emerald-800' \n                : 'bg-rose-50 border-rose-200 text-rose-800'\n            }`}>\n              <div className=\"flex items-center gap-2\">\n                {isPhraseCompliant ? (\n                  <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n                ) : (\n                  <ShieldAlert className=\"w-4 h-4 text-rose-600\" />\n                )}\n                <span>\n                  {isPhraseCompliant \n                    ? `Compliant Greeting: Matched keywords and spoken within ${formSettings.answerPhraseDeadlineSeconds}s deadline.`\n                    : testTimestamp > formSettings.answerPhraseDeadlineSeconds\n                    ? `Non-compliant: Greeting delayed (${testTimestamp}s > ${formSettings.answerPhraseDeadlineSeconds}s limit).`\n                    : `Non-compliant: Greeting missing mandatory brand tokens ('Thank you for calling', 'Support').`}\n                <\/span>\n              <\/div>\n\n              <span className=\"font-mono font-semibold\">\n                {isPhraseCompliant ? 'PASS' : 'FLAGGED'}\n              <\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        {/* Save Bar */}\n        <div className=\"pt-2 flex items-center justify-between\">\n          <div className=\"text-xs text-slate-500\">\n            Saving will automatically re-evaluate active screening rules across all calls.\n          <\/div>\n\n          <div className=\"flex items-center gap-3\">\n            {savedSuccess && (\n              <span className=\"text-xs text-emerald-600 font-medium flex items-center gap-1\">\n                <Check className=\"w-3.5 h-3.5\" />\n                Saved & Screened!\n              <\/span>\n            )}\n\n            <button\n              type=\"submit\"\n              className=\"px-5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-md shadow-sm transition-colors\"\n            >\n              Save Settings & Re-screen Calls\n            <\/button>\n          <\/div>\n        <\/div>\n      <\/form>\n    <\/div>\n  );\n};\n", "src/context/CallContext.tsx": "import React, { createContext, useContext, useState, useEffect, useRef } from 'react';\nimport { \n  CallRecord, \n  ScreeningSettings, \n  FilterState, \n  QADecision, \n  ReviewStatus \n} from '../types';\nimport { INITIAL_MOCK_CALLS, DEFAULT_SCREENING_SETTINGS } from '../data/mockCalls';\nimport { screenCallRecord } from '../services/screeningEngine';\n\nexport type AppView = 'dashboard' | 'queue' | 'analysis' | 'reports' | 'settings';\n\ninterface AudioPlayerState {\n  isPlaying: boolean;\n  currentTime: number;\n  duration: number;\n  speed: number;\n  volume: number;\n  activeCallId: string | null;\n}\n\ninterface CallContextType {\n  calls: CallRecord[];\n  selectedCallId: string | null;\n  selectedCall: CallRecord | null;\n  activeView: AppView;\n  settings: ScreeningSettings;\n  filters: FilterState;\n  audioPlayer: AudioPlayerState;\n  notification: { message: string; type: 'success' | 'info' | 'warning' } | null;\n  \n  // Navigation & Selection\n  setActiveView: (view: AppView) => void;\n  selectCall: (callId: string, targetView?: AppView) => void;\n  \n  // Filtering & Search\n  setFilters: React.Dispatch<React.SetStateAction<FilterState>>;\n  resetFilters: () => void;\n  filteredCalls: CallRecord[];\n\n  // Actions\n  saveQAReview: (callId: string, decision: QADecision) => void;\n  updateSettings: (newSettings: Partial<ScreeningSettings>) => void;\n  rescreenAllCalls: () => void;\n  resetDemoData: () => void;\n  simulateNewCall: () => void;\n  clearNotification: () => void;\n\n  // Audio Playback\n  toggleAudioPlay: (callId?: string) => void;\n  seekAudio: (seconds: number) => void;\n  setAudioSpeed: (speed: number) => void;\n  setAudioVolume: (volume: number) => void;\n}\n\nconst STORAGE_KEY_CALLS = 'callguard_ai_calls_v2';\nconst STORAGE_KEY_SETTINGS = 'callguard_ai_settings_v2';\n\nconst DEFAULT_FILTERS: FilterState = {\n  searchQuery: '',\n  statusFilter: 'All',\n  flagFilter: 'All',\n  durationBucket: 'All',\n  priorityFilter: 'All',\n  certaintyFilter: 'All',\n  dateRange: 'All',\n  sortBy: 'callTime',\n  sortOrder: 'desc'\n};\n\nconst CallContext = createContext<CallContextType | undefined>(undefined);\n\nexport const CallProvider: React.FC<{ children: React.ReactNode }> = ({ children }) => {\n  // Load saved state or default\n  const [calls, setCalls] = useState<CallRecord[]>(() => {\n    try {\n      const stored = localStorage.getItem(STORAGE_KEY_CALLS);\n      if (stored) {\n        return JSON.parse(stored);\n      }\n    } catch {\n      // ignore\n    }\n    return INITIAL_MOCK_CALLS;\n  });\n\n  const [settings, setSettings] = useState<ScreeningSettings>(() => {\n    try {\n      const stored = localStorage.getItem(STORAGE_KEY_SETTINGS);\n      if (stored) {\n        return JSON.parse(stored);\n      }\n    } catch {\n      // ignore\n    }\n    return DEFAULT_SCREENING_SETTINGS;\n  });\n\n  const [selectedCallId, setSelectedCallId] = useState<string | null>(calls[1]?.id || calls[0]?.id || null);\n  const [activeView, setActiveView] = useState<AppView>('dashboard');\n  const [filters, setFilters] = useState<FilterState>(DEFAULT_FILTERS);\n  const [notification, setNotification] = useState<{ message: string; type: 'success' | 'info' | 'warning' } | null>(null);\n\n  // Audio simulation state\n  const [audioPlayer, setAudioPlayer] = useState<AudioPlayerState>({\n    isPlaying: false,\n    currentTime: 0,\n    duration: 22,\n    speed: 1.0,\n    volume: 0.85,\n    activeCallId: null\n  });\n\n  const playbackTimerRef = useRef<number | null>(null);\n\n  // Persist calls and settings to localStorage\n  useEffect(() => {\n    try {\n      localStorage.setItem(STORAGE_KEY_CALLS, JSON.stringify(calls));\n    } catch (e) {\n      console.warn('Failed to save to localStorage', e);\n    }\n  }, [calls]);\n\n  useEffect(() => {\n    try {\n      localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));\n    } catch (e) {\n      console.warn('Failed to save settings', e);\n    }\n  }, [settings]);\n\n  const selectedCall = calls.find(c => c.id === selectedCallId) || null;\n\n  // Sync audio duration whenever selected call changes\n  useEffect(() => {\n    if (selectedCall) {\n      setAudioPlayer(prev => ({\n        ...prev,\n        duration: selectedCall.durationSeconds,\n        currentTime: 0,\n        isPlaying: false,\n        activeCallId: selectedCall.id\n      }));\n    }\n  }, [selectedCallId]);\n\n  // Audio Playback simulation ticker\n  useEffect(() => {\n    if (audioPlayer.isPlaying) {\n      playbackTimerRef.current = window.setInterval(() => {\n        setAudioPlayer(prev => {\n          const nextTime = prev.currentTime + 0.25 * prev.speed;\n          if (nextTime >= prev.duration) {\n            return {\n              ...prev,\n              currentTime: prev.duration,\n              isPlaying: false\n            };\n          }\n          return {\n            ...prev,\n            currentTime: nextTime\n          };\n        });\n      }, 250);\n    } else if (playbackTimerRef.current) {\n      clearInterval(playbackTimerRef.current);\n      playbackTimerRef.current = null;\n    }\n\n    return () => {\n      if (playbackTimerRef.current) {\n        clearInterval(playbackTimerRef.current);\n      }\n    };\n  }, [audioPlayer.isPlaying, audioPlayer.speed]);\n\n  const toggleAudioPlay = (callId?: string) => {\n    const targetCallId = callId || selectedCallId;\n    if (!targetCallId) return;\n\n    if (audioPlayer.activeCallId !== targetCallId) {\n      const call = calls.find(c => c.id === targetCallId);\n      if (call) {\n        setAudioPlayer({\n          ...audioPlayer,\n          activeCallId: targetCallId,\n          currentTime: 0,\n          duration: call.durationSeconds,\n          isPlaying: true\n        });\n        return;\n      }\n    }\n\n    // Toggle current\n    if (audioPlayer.currentTime >= audioPlayer.duration) {\n      setAudioPlayer(prev => ({ ...prev, currentTime: 0, isPlaying: true }));\n    } else {\n      setAudioPlayer(prev => ({ ...prev, isPlaying: !prev.isPlaying }));\n    }\n  };\n\n  const seekAudio = (seconds: number) => {\n    setAudioPlayer(prev => ({\n      ...prev,\n      currentTime: Math.max(0, Math.min(seconds, prev.duration))\n    }));\n  };\n\n  const setAudioSpeed = (speed: number) => {\n    setAudioPlayer(prev => ({ ...prev, speed }));\n  };\n\n  const setAudioVolume = (volume: number) => {\n    setAudioPlayer(prev => ({ ...prev, volume }));\n  };\n\n  const selectCall = (callId: string, targetView: AppView = 'analysis') => {\n    setSelectedCallId(callId);\n    setActiveView(targetView);\n  };\n\n  const resetFilters = () => {\n    setFilters(DEFAULT_FILTERS);\n  };\n\n  const saveQAReview = (callId: string, decision: QADecision) => {\n    setCalls(prev => prev.map(call => {\n      if (call.id !== callId) return call;\n      return {\n        ...call,\n        reviewStatus: decision.status,\n        qaDecision: decision,\n        flags: call.flags.map(flag => {\n          const humanVerdict = decision.flagVerdicts[flag.id];\n          return humanVerdict ? { ...flag, humanVerdict } : flag;\n        })\n      };\n    }));\n\n    setNotification({\n      message: `QA Decision successfully recorded for ${callId} as \"${decision.status}\".`,\n      type: 'success'\n    });\n  };\n\n  const updateSettings = (newSettings: Partial<ScreeningSettings>) => {\n    setSettings(prev => {\n      const updated = { ...prev, ...newSettings };\n      return updated;\n    });\n    setNotification({\n      message: 'Screening configuration updated. Use \"Re-screen All Calls\" to recalculate flags.',\n      type: 'info'\n    });\n  };\n\n  const rescreenAllCalls = () => {\n    setCalls(prev => prev.map(c => screenCallRecord(c, settings)));\n    setNotification({\n      message: `Screening rules re-evaluated across ${calls.length} calls against current thresholds.`,\n      type: 'success'\n    });\n  };\n\n  const resetDemoData = () => {\n    setCalls(INITIAL_MOCK_CALLS);\n    setSettings(DEFAULT_SCREENING_SETTINGS);\n    setSelectedCallId(INITIAL_MOCK_CALLS[1]?.id || INITIAL_MOCK_CALLS[0]?.id);\n    setNotification({\n      message: 'Demo dataset restored to original sample state.',\n      type: 'info'\n    });\n  };\n\n  const simulateNewCall = () => {\n    const agents = ['Maya Lin', 'Marcus Vance', 'Chloe Sterling', 'Aiden Scott', 'Priya Patel', 'Devon Reed', 'Jordan Blake'];\n    const randomAgent = agents[Math.floor(Math.random() * agents.length)];\n    const duration = Math.floor(Math.random() * 25) + 8; // 8 to 32 seconds\n    const newId = `CALL-${Math.floor(Math.random() * 89999) + 10000}`;\n    const dateStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });\n\n    const newCallRaw: CallRecord = {\n      id: newId,\n      agentId: `AGT-${Math.floor(Math.random() * 80) + 100}`,\n      agentName: randomAgent,\n      agentTeam: 'Tier 1 Consumer Support',\n      customerNumber: `+1 (555) ${Math.floor(Math.random() * 899) + 100}-${Math.floor(Math.random() * 8999) + 1000}`,\n      customerName: 'Customer Inbound',\n      callTime: `Today ${dateStr}`,\n      durationSeconds: duration,\n      direction: 'Inbound',\n      queueName: 'Billing Inquiries',\n      answerPhraseMatched: duration > 15,\n      answerPhraseTimestamp: duration > 15 ? 2.4 : undefined,\n      overallCertainty: duration < 12 ? 'Inconclusive' : 'High',\n      priority: duration < 15 ? 'High' : 'Medium',\n      reviewStatus: 'Pending Review',\n      audioWaveform: [0.1, 0.35, 0.65, 0.72, 0.58, 0.42, 0.35, 0.22, 0.1],\n      audioMetrics: {\n        snrDb: 15.4,\n        backgroundNoiseLevel: 'Moderate',\n        echoDetected: false,\n        choppinessScore: 10,\n        packetLossRate: 0.8,\n        carrierSipCode: 'SIP 200 OK',\n        disconnectReason: duration < 15 ? 'Inconclusive / Unknown' : 'Normal Hangup',\n        audioClarityScore: 84\n      },\n      flags: [],\n      transcript: [\n        {\n          id: 'T1',\n          speaker: 'Agent',\n          speakerName: randomAgent,\n          startTime: 2.1,\n          endTime: 5.2,\n          text: 'Thank you for calling Apex Support, how may I assist you today?',\n          confidence: 96\n        },\n        {\n          id: 'T     (t.text.toLowerCase().includes('thank you for calling') || \n     t.text.toLowerCase().includes('support') ||\n     t.text.toLowerCase().includes('my name is'))\n  );\n\n  const answerTimestamp = call.answerPhraseTimestamp ?? (hasGreetingInTranscript ? 2.2 : undefined);\n\n  if (answerTimestamp !== undefined) {\n    if (answerTimestamp > settings.answerPhraseDeadlineSeconds) {\n      const existing = call.flags.find(f => f.category === 'Delayed Answer Phrase');\n      updatedFlags.push({\n        id: existing ? existing.id : `FLG-DAP-${call.id}`,\n        category: 'Delayed Answer Phrase',\n        title: `Delayed answer phrase (${answerTimestamp}s)`,\n        description: `Agent delivered greeting at ${answerTimestamp}s, exceeding the required deadline of ${settings.answerPhraseDeadlineSeconds}s.`,\n        timestampStart: 0,\n        timestampEnd: answerTimestamp,\n        confidence: 94,\n        isCertain: true,\n        evidence: `Greeting detected at ${answerTimestamp}s. Target SLA is within first ${settings.answerPhraseDeadlineSeconds}s.`,\n        suggestedAction: 'Reinforce greeting cadence in 1-on-1 coaching.',\n        humanVerdict: existing?.humanVerdict\n      });\n    }\n  } else if (!call.answerPhraseMatched) {\n    // Completely missing or inconclusive\n    const existing = call.flags.find(f => f.category === 'Missing Answer Phrase');\n    const isInconclusive = call.overallCertainty === 'Inconclusive' || call.audioMetrics.snrDb < 8;\n    updatedFlags.push({\n      id: existing ? existing.id : `FLG-MAP-${call.id}`,\n      category: 'Missing Answer Phrase',\n      title: isInconclusive ? 'Answer phrase status inconclusive' : 'Required answer phrase missing',\n      description: isInconclusive \n        ? 'Speech detected but low SNR / faint gain prevented confident phrase matching.'\n        : 'No recognized brand greeting delivered by associate within the opening segment.',\n      timestampStart: 0,\n      timestampEnd: Math.min(5, call.durationSeconds),\n      confidence: isInconclusive ? 55 : 98,\n      isCertain: !isInconclusive,\n      evidence: isInconclusive \n        ? 'Acoustic energy present but transcription confidence under 60%. Advisory only.'\n        : 'Zero matching greeting tokens found on associate audio stream.',\n      suggestedAction: isInconclusive ? 'Human listening required.' : 'Verify associate adherence.',\n      humanVerdict: existing?.humanVerdict\n    });\n  }\n\n  // Rule 3: No Interaction detection\n  const agentSpoke = call.transcript.some(t => t.speaker === 'Agent' && t.confidence > 60 && !t.text.includes('[Complete silence'));\n  if (!agentSpoke && call.durationSeconds > 10) {\n    const existing = call.flags.find(f => f.category === 'No Interaction');\n    updatedFlags.push({\n      id: existing ? existing.id : `FLG-NOINT-${call.id}`,\n      category: 'No Interaction',\n      title: 'No apparent agent-caller interaction',\n      description: 'Zero verified associate verbal response detected during call.',\n      timestampStart: 0,\n      timestampEnd: call.durationSeconds,\n      confidence: 96,\n      isCertain: true,\n      evidence: 'Associate channel audio level remained silent (-54 dBFS) throughout duration.',\n      suggestedAction: 'Check headset physical connection and softphone auto-answer mute.',\n      humanVerdict: existing?.humanVerdict\n    });\n  }\n\n  // Rule 4: Potential Disconnect Screening\n  if (call.audioMetrics.disconnectReason === 'Carrier Drop' || call.audioMetrics.disconnectReason === 'Agent Terminated') {\n    const existing = call.flags.find(f => f.category === 'Potential Disconnect');\n    const isCarrier = call.audioMetrics.disconnectReason === 'Carrier Drop';\n    updatedFlags.push({\n      id: existing ? existing.id : `FLG-DISC-${call.id}`,\n      category: 'Potential Disconnect',\n      title: isCarrier ? 'Potential carrier telephony drop' : 'Early disconnect event logged',\n      description: isCarrier \n        ? `Telephony gateway reported carrier level termination (${call.audioMetrics.carrierSipCode || 'RST'}).`\n        : `Telephony event indicates associate release action at end of session.`,\n      timestampStart: Math.max(0, call.durationSeconds - 2),\n      timestampEnd: call.durationSeconds,\n      confidence: isCarrier ? 88 : 95,\n      isCertain: !settings.requireHumanConfirmationForDisconnect,\n      evidence: settings.requireHumanConfirmationForDisconnect \n        ? `MANDATORY SAFEGUARD: Call duration alone must never be treated as proof of intentional disconnection. Carrier code: ${call.audioMetrics.carrierSipCode}.`\n        : `Carrier code: ${call.audioMetrics.carrierSipCode}`,\n      suggestedAction: isCarrier ? 'Escalate to Telecom Operations.' : 'Review call context before coaching.',\n      humanVerdict: existing?.humanVerdict\n    });\n  }\n\n  // Rule 5: Audio Quality - Background Noise\n  if (settings.flagBackgroundNoise && (call.audioMetrics.backgroundNoiseLevel === 'Severe' || call.audioMetrics.snrDb < settings.noiseSnrThresholdDb)) {\n    const existing = call.flags.find(f => f.category === 'Audio: Background Noise');\n    updatedFlags.push({\n      id: existing ? existing.id : `FLG-NOISE-${call.id}`,\n      category: 'Audio: Background Noise',\n      title: `Excessive background noise (SNR ${call.audioMetrics.snrDb.toFixed(1)} dB)`,\n      description: `Ambient noise floor exceeds acceptable acoustic threshold of ${settings.noiseSnrThresholdDb} dB SNR.`,\n      timestampStart: 1,\n      timestampEnd: Math.min(10, call.durationSeconds),\n      confidence: 89,\n      isCertain: true,\n      evidence: `Measured SNR: ${call.audioMetrics.snrDb} dB vs threshold ${settings.noiseSnrThresholdDb} dB. Classification: ${call.audioMetrics.backgroundNoiseLevel}.`,\n      suggestedAction: 'Advise associate on headset noise gate settings and workspace noise policy.',\n      humanVerdict: existing?.humanVerdict\n    });\n  }\n\n  // Rule 6: Audio Quality - Echo\n  if (settings.flagEcho && call.audioMetrics.echoDetected) {\n    const existing = call.flags.find(f => f.category === 'Audio: Echo');\n    updatedFlags.push({\n      id: existing ? existing.id : `FLG-ECHO-${call.id}`,\n      category: 'Audio: Echo',\n      title: `Acoustic feedback / echo detected (${call.audioMetrics.echoDelayMs || 200}ms)`,\n      description: 'Acoustic echo cancellation failed or customer voice looped through associate open speaker.',\n      timestampStart: 4,\n      timestampEnd: Math.min(25, call.durationSeconds),\n      confidence: 94,\n      isCertain: true,\n      evidence: `Strong auto-correlation peak detected at delay ${call.audioMetrics.echoDelayMs || 200}ms.`,\n      suggestedAction: 'Ensure associate is using an approved noise-cancelling binaural headset.',\n      humanVerdict: existing?.humanVerdict\n    });\n  }\n\n  // Rule 7: Audio Quality - Choppiness & Packet Loss\n  if (settings.flagChoppyAudio && (call.audioMetrics.choppinessScore > settings.choppinessThreshold || call.audioMetrics.packetLossRate > 5)) {\n    const existing = call.flags.find(f => f.category === 'Audio: Choppy / Packet Loss');\n    updatedFlags.push({\n      id: existing ? existing.id : `FLG-CHOP-${call.id}`,\n      category: 'Audio: Choppy / Packet Loss',\n      title: `Choppy audio & high packet loss (${call.audioMetrics.packetLossRate.toFixed(1)}%)`,\n      description: `Voice jitter and packet loss exceed standard VOIP SLA limits (${call.audioMetrics.packetLossRate}% > 5%).`,\n      timestampStart: 6,\n      timestampEnd: Math.min(24, call.durationSeconds),\n      confidence: 92,\n      isCertain: true,\n      evidence: `Packet loss rate: ${call.audioMetrics.packetLossRate.toFixed(1)}%, Choppiness index: ${call.audioMetrics.choppinessScore}/100.`,\n      suggestedAction: 'Submit IT Network diagnostic for associate workstation.',\n      humanVerdict: existing?.humanVerdict\n    });\n  }\n\n  // Preserve any other existing flags (e.g. Ringing)\n  call.flags.forEach(f => {\n    if (!updatedFlags.some(uf => uf.category === f.category)) {\n      updatedFlags.push(f);\n    }\n  });\n\n  return {\n    ...call,\n    flags: updatedFlags\n  };\n}\n\n/**\n * Generates an exportable CSV string of the filtered call dataset\n */\nexport function exportCallsToCSV(calls: CallRecord[]): string {\n  const headers = [\n    'Call ID',\n    'Agent Name',\n    'Agent Team',\n    'Duration (s)',\n    'Call Date',\n    'Answer Phrase Status',\n    'Answer Timestamp (s)',\n    'Detected Flags Count',\n    'Flag Categories',\n    'Audio SNR (dB)',\n    'Packet Loss (%)',\n    'Certainty',\n    'Priority',\n    'QA Review Status',\n    'Human QA Decision',\n    'QA Notes'\n  ];\n\n  const rows = calls.map(c => [\n    `\"${c.id}\"`,\n    `\"${c.agentName}\"`,\n    `\"${c.agentTeam}\"`,\n    c.durationSeconds,\n    `\"${c.callTime}\"`,\n    c.answerPhraseMatched ? '\"Compliant\"' : '\"Non-compliant / Missing\"',\n    c.answerPhraseTimestamp ?? 'N/A',\n    c.flags.length,\n    `\"${c.flags.map(f => f.category).join('; ')}\"`,\n    c.audioMetrics.snrDb.toFixed(1),\n    c.audioMetrics.packetLossRate.toFixed(1),\n    `\"${c.overallCertainty}\"`,\n    `\"${c.priority}\"`,\n    `\"${c.reviewStatus}\"`,\n    `\"${c.qaDecision?.primaryDisposition ?? 'Not Reviewed'}\"`,\n    `\"${(c.qaDecision?.notes ?? '').replace(/\"/g, '\"\"')}\"`\n  ]);\n\n  return [headers.join(','), ...rows.map(r => r.join(','))].join('\\n');\n}\n", "src/services/zipExporter.ts": "import JSZip from 'jszip';\n\n// Raw content templates for the exported zip package\nconst PACKAGE_JSON_CONTENT = `{\n  \"name\": \"callguard-ai\",\n  \"private\": true,\n  \"version\": \"1.0.0\",\n  \"type\": \"module\",\n  \"scripts\": {\n    \"dev\": \"vite --port=3000 --host=0.0.0.0\",\n    \"build\": \"vite build\",\n    \"preview\": \"vite preview\"\n  },\n  \"dependencies\": {\n    \"@tailwindcss/vite\": \"^4.3.3\",\n    \"@vitejs/plugin-react\": \"^6.1.1\",\n    \"jszip\": \"^3.10.1\",\n    \"lucide-react\": \"^0.546.0\",\n    \"react\": \"^19.0.1\",\n    \"react-dom\": \"^19.0.1\",\n    \"tailwindcss\": \"^4.3.3\",\n    \"vite\": \"^8.3.0\"\n  },\n  \"devDependencies\": {\n    \"@types/jszip\": \"^3.4.1\",\n    \"@types/node\": \"^22.14.0\",\n    \"@types/react\": \"^19.3.0\",\n    \"@types/react-dom\": \"^19.3.0\",\n    \"typescript\": \"^7.0.2\"\n  }\n}`;\n\nconst TSCONFIG_CONTENT = `{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"experimentalDecorators\": true,\n    \"useDefineForClassFields\": false,\n    \"module\": \"ESNext\",\n    \"types\": [\"vite/client\"],\n    \"lib\": [\"ES2022\", \"DOM\", \"DOM.Iterable\"],\n    \"skipLibCheck\": true,\n    \"moduleResolution\": \"bundler\",\n    \"isolatedModules\": true,\n    \"moduleDetection\": \"force\",\n    \"allowJs\": true,\n    \"jsx\": \"react-jsx\",\n    \"paths\": {\n      \"@/*\": [\"./*\"]\n    },\n    \"noEmit\": true\n  }\n}`;\n\nconst VITE_CONFIG_CONTENT = `import tailwindcss from '@tailwindcss/vite';\nimport react from '@vitejs/plugin-react';\nimport path from 'path';\nimport {defineConfig} from 'vite';\n\nexport default defineConfig(() => {\n  return {\n    plugins: [react(), tailwindcss()],\n    resolve: {\n      alias: {\n        '@': path.resolve(__dirname, '.'),\n      },\n    },\n    server: {\n      host: '0.0.0.0',\n      port: 3000,\n      strictPort: true,\n      allowedHosts: true,\n      cors: true,\n    },\n  };\n});\n`;\n\nconst INDEX_HTML_CONTENT = `<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>CallGuard AI \u2014 CX Short-Call & Audio Quality Screening Tool<\/title>\n    <meta name=\"description\" content=\"AI-assisted short-call and audio quality screening tool for Customer Experience Quality Assurance teams.\" />\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n  <\/head>\n  <body class=\"bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-100 selection:text-indigo-900\">\n    <div id=\"root\"><\/div>\n    <script type=\"module\" src=\"/src/main.tsx\"><\/script>\n  <\/body>\n<\/html>\n`;\n\nconst README_CONTENT = `# CallGuard AI \u2014 CX Short-Call & Audio Quality Screening Tool\n\nCallGuard AI is an automated screening and Quality Assurance (QA) decision tool for Customer Experience Associate calls.\n\n## Quick Start (Run Locally)\n\n1. Unpack this folder.\n2. Ensure you have **Node.js (v18+)** installed.\n3. Open your terminal in this directory and run:\n\n\\`\\`\\`bash\n# 1. Install dependencies\nnpm install\n\n# 2. Start the local server\nnpm run dev\n\\`\\`\\`\n\n4. Open your browser at:\n**http://localhost:3000** (or http://127.0.0.1:3000)\n\n## Features Included\n- **Dashboard**: Screened calls summary, 0-30s short calls count, audio anomaly health meters, and QA outcome distribution.\n- **Review Queue**: Filterable, searchable, and sortable table with multi-criteria filters and CSV export.\n- **Call Analysis**: Interactive waveform audio player simulation, synchronized transcript with click-to-seek, spectral diagnostics, and evidence markers.\n- **QA Decision Workspace**: Human verdict recording, disposition assignment, evidence timestamp logging, and technical escalation ticket generation.\n- **Reports & Analytics**: AI vs. Human accuracy reconciliation, short-call duration histogram, associate performance matrix, and CSV/JSON export.\n- **Rules & Settings**: Configurable short-call thresholds, answer-phrase deadlines, acoustic tolerances, and interactive phrase testing sandbox.\n`;\n\nconst INDEX_CSS_CONTENT = `@import \"tailwindcss\";\n\n@layer base {\n  body {\n    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n  }\n  .font-mono {\n    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;\n  }\n}\n\n/* Custom scrollbars */\n::-webkit-scrollbar {\n  width: 6px;\n  height: 6px;\n}\n::-webkit-scrollbar-track {\n  background: transparent;\n}\n::-webkit-scrollbar-thumb {\n  background: #cbd5e1;\n  border-radius: 3px;\n}\n::-webkit-scrollbar-thumb:hover {\n  background: #94a3b8;\n}\n`;\n\nconst MAIN_TSX_CONTENT = `import {createRoot} from 'react-dom/client';\nimport App from './App.tsx';\nimport './index.css';\n\ncreateRoot(document.getElementById('root')!).render(<App />);\n`;\n\n/**\n * Packages all project files into a downloadable ZIP archive\n */\nexport async function downloadProjectZip(): Promise<void> {\n  const zip = new JSZip();\n\n  // Root configuration files\n  zip.file('package.json', PACKAGE_JSON_CONTENT);\n  zip.file('tsconfig.json', TSCONFIG_CONTENT);\n  zip.file('vite.config.ts', VITE_CONFIG_CONTENT);\n  zip.file('index.html', INDEX_HTML_CONTENT);\n  zip.file('README.md', README_CONTENT);\n\n  // Src folder\n  const src = zip.folder('src')!;\n  src.file('main.tsx', MAIN_TSX_CONTENT);\n  src.file('index.css', INDEX_CSS_CONTENT);\n\n  // Dynamic modules fetch or embed\n  try {\n    // Fetch currently running source files from local Vite dev server\n    const fetchPromises = [\n      fetch('/src/App.tsx').then(r => r.text()).then(t => src.file('App.tsx', t)),\n      fetch('/src/types/index.ts').then(r => r.text()).then(t => src.folder('types')!.file('index.ts', t)),\n      fetch('/src/data/mockCalls.ts').then(r => r.text()).then(t => src.folder('data')!.file('mockCalls.ts', t)),\n      fetch('/src/services/screeningEngine.ts').then(r => r.text()).then(t => src.folder('services')!.file('screeningEngine.ts', t)),\n      fetch('/src/services/zipExporter.ts').then(r => r.text()).then(t => src.folder('services')!.file('zipExporter.ts', t)),\n      fetch('/src/context/CallContext.tsx').then(r => r.text()).then(t => src.folder('context')!.file('CallContext.tsx', t)),\n      fetch('/src/components/common/Header.tsx').then(r => r.text()).then(t => src.folder('components')!.folder('common')!.file('Header.tsx', t)),\n      fetch('/src/components/common/Sidebar.tsx').then(r => r.text()).then(t => src.folder('components')!.folder('common')!.file('Sidebar.tsx', t)),\n      fetch('/src/components/dashboard/DashboardView.tsx').then(r => r.text()).then(t => src.folder('components')!.folder('dashboard')!.file('DashboardView.tsx', t)),\n      fetch('/src/components/queue/QueueView.tsx').then(r => r.text()).then(t => src.folder('components')!.folder('queue')!.file('QueueView.tsx', t)),\n      fetch('/src/components/analysis/CallAnalysisView.tsx').then(r => r.text()).then(t => src.folder('components')!.folder('analysis')!.file('CallAnalysisView.tsx', t)),\n      fetch('/src/components/reports/ReportsView.tsx').then(r => r.text()).then(t => src.folder('components')!.folder('reports')!.file('ReportsView.tsx', t)),\n      fetch('/src/components/settings/SettingsView.tsx').then(r => r.text()).then(t => src.folder('components')!.folder('settings')!.file('SettingsView.tsx', t)),\n    ];\n\n    await Promise.all(fetchPromises);\n  } catch (err) {\n    console.warn('Network fetch for some source files failed, falling back to bundled core', err);\n  }\n\n  // Generate zip file\n  const content = await zip.generateAsync({ type: 'blob' });\n  const url = URL.createObjectURL(content);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'CallGuard-AI-Prototype.zip';\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n}\n", "src/types/index.ts": "export type Priority = 'High' | 'Medium' | 'Low';\n\nexport type ReviewStatus = \n  | 'Pending Review' \n  | 'Confirmed Issue' \n  | 'Dismissed' \n  | 'Needs Further Review' \n  | 'Escalated';\n\nexport type FlagCategory = \n  | 'Short Call' \n  | 'Missing Answer Phrase' \n  | 'Delayed Answer Phrase' \n  | 'No Interaction' \n  | 'Potential Disconnect' \n  | 'Audio: Echo' \n  | 'Audio: Background Noise' \n  | 'Audio: Choppy / Packet Loss' \n  | 'Audio: Ringing / Telephony';\n\nexport interface FlagItem {\n  id: string;\n  category: FlagCategory;\n  title: string;\n  description: string;\n  timestampStart?: number; // in seconds\n  timestampEnd?: number; // in seconds\n  confidence: number; // 0 to 100\n  isCertain: boolean; // false if inconclusive/uncertain\n  evidence: string;\n  suggestedAction: string;\n  humanVerdict?: 'Confirmed' | 'Dismissed' | 'Inconclusive';\n}\n\nexport interface TranscriptUtterance {\n  id: string;\n  speaker: 'Agent' | 'Customer' | 'System' | 'Carrier';\n  speakerName: string;\n  startTime: number; // seconds\n  endTime: number; // seconds\n  text: string;\n  confidence: number; // 0 to 100\n  flagged?: boolean;\n  notes?: string;\n}\n\nexport interface AudioMetrics {\n  snrDb: number; // Signal to Noise ratio (e.g. 18dB good, <10dB noisy)\n  backgroundNoiseLevel: 'Low' | 'Moderate' | 'Severe';\n  echoDetected: boolean;\n  echoDelayMs?: number;\n  choppinessScore: number; // 0 to 100\n  packetLossRate: number; // e.g. 1.2%\n  carrierSipCode?: string; // e.g. \"SIP 200 OK\", \"SIP 487 Request Terminated\"\n  disconnectReason?: 'Normal Hangup' | 'Carrier Drop' | 'Agent Terminated' | 'Inconclusive / Unknown';\n  audioClarityScore: number; // 0 to 100\n}\n\nexport interface QADecision {\n  reviewedBy: string;\n  reviewedAt: string; // ISO string\n  status: ReviewStatus;\n  primaryDisposition: \n    | 'Coaching Required' \n    | 'No Action Needed / False Positive' \n    | 'Telephony / Tech Escalation' \n    | 'Commendation' \n    | 'Further Investigation Required';\n  notes: string;\n  flagVerdicts: Record<string, 'Confirmed' | 'Dismissed' | 'Inconclusive'>;\n  evidenceTimestamps: string[];\n  coachingPoints?: string;\n  technicalEscalationTicket?: string;\n}\n\nexport interface CallRecord {\n  id: string;\n  agentId: string;\n  agentName: string;\n  agentTeam: string;\n  customerNumber: string;\n  customerName: string;\n  callTime: string; // ISO string or format \"2026-10-12 09:14 AM\"\n  durationSeconds: number;\n  direction: 'Inbound' | 'Outbound';\n  queueName: string;\n  answerPhraseMatched: boolean;\n  answerPhraseTimestamp?: number; // in seconds\n  answerPhraseDetected?: string;\n  flags: FlagItem[];\n  overallCertainty: 'High' | 'Moderate' | 'Inconclusive';\n  priority: Priority;\n  reviewStatus: ReviewStatus;\n  audioMetrics: AudioMetrics;\n  transcript: TranscriptUtterance[];\n  qaDecision?: QADecision;\n  audioWaveform: number[]; // Array of 40-60 normalized audio amplitude values [0.1..1.0]\n}\n\nexport interface ScreeningSettings {\n  shortCallThresholdSeconds: number; // default: 30\n  answerPhraseDeadlineSeconds: number; // default: 5\n  requiredAnswerPhrase: string; // default: \"Thank you for calling Apex Support, my name is {Agent}, how can I help you today?\"\n  flagBackgroundNoise: boolean;\n  noiseSnrThresholdDb: number; // default: 12\n  flagEcho: boolean;\n  flagChoppyAudio: boolean;\n  choppinessThreshold: number; // default: 25%\n  requireHumanConfirmationForDisconnect: boolean; // default: true (compliance safeguard)\n}\n\nexport interface FilterState {\n  searchQuery: string;\n  statusFilter: string; // 'All' | ReviewStatus\n  flagFilter: string; // 'All' | FlagCategory\n  durationBucket: 'All' | '0-15s' | '16-30s' | '31-60s' | '>60s';\n  priorityFilter: 'All' | Priority;\n  certaintyFilter: 'All' | 'High' | 'Moderate' | 'Inconclusive';\n  dateRange: 'Today' | 'Past 7 Days' | 'Past 30 Days' | 'All';\n  sortBy: 'callTime' | 'durationSeconds' | 'priority' | 'confidence' | 'id';\n  sortOrder: 'asc' | 'desc';\n}\n"}</script>
<script>
(function () {
  const sources = JSON.parse(document.getElementById('sources').textContent);
  const exts = ['', '.tsx', '.ts', '/index.tsx', '/index.ts'];
  const dirname = p => p.slice(0, p.lastIndexOf('/'));
  function resolve(from, spec) {
    const out = [];
    for (const s of (dirname(from) + '/' + spec).split('/')) { if (s === '..') out.pop(); else if (s !== '.' && s !== '') out.push(s); }
    const base = out.join('/');
    for (const e of exts) if (sources[base + e] !== undefined) return base + e;
    return null;
  }
  const compiled = {}, deps = {};
  for (const [file, code] of Object.entries(sources)) {
    deps[file] = [];
    const rewrite = path => {
      const s = path.node.source; if (!s || !s.value.startsWith('.')) return;
      if (s.value.endsWith('.css')) { path.remove(); return; }
      const r = resolve(file, s.value);
      if (r) { deps[file].push(r); s.value = '__MOD__' + r; }
    };
    compiled[file] = Babel.transform(code, {
      filename: file,
      presets: [['typescript', { isTSX: true, allExtensions: true }], ['react', { runtime: 'automatic' }]],
      plugins: [() => ({ visitor: { ImportDeclaration: rewrite, ExportNamedDeclaration: rewrite, ExportAllDeclaration: rewrite } })],
    }).code;
  }
  const urls = {}, visiting = new Set();
  function load(file) {
    if (urls[file]) return urls[file];
    if (visiting.has(file)) throw new Error('Circular import: ' + file);
    visiting.add(file);
    deps[file].forEach(load);
    const code = compiled[file].replace(/(["'])__MOD__([^"']+)\1/g, (_, q, f) => q + urls[f] + q);
    return urls[file] = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  }
  try {
    import(load('src/main.tsx')).catch(fail);
  } catch (e) { fail(e); }
  function fail(err) {
    console.error(err);
    document.getElementById('root').innerHTML = '<pre style="color:#b91c1c;padding:24px;white-space:pre-wrap">Failed to start: ' + String(err && err.stack || err) + '</pre>';
  }
})();
</script>
