{

<script type="application/json" id="sources">{"src/App.tsx": "/**\n * @license\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport React, { useState } from 'react';\nimport { CallProvider, useCallContext } from './context/CallContext';\nimport { Header } from './components/common/Header';\nimport { Sidebar } from './components/common/Sidebar';\nimport { DashboardView } from './components/dashboard/DashboardView';\nimport { QueueView } from './components/queue/QueueView';\nimport { CallAnalysisView } from './components/analysis/CallAnalysisView';\nimport { ReportsView } from './components/reports/ReportsView';\nimport { SettingsView } from './components/settings/SettingsView';\nimport { CheckCircle2, Info, AlertTriangle, X, Menu } from 'lucide-react';\n\nconst AppContent: React.FC = () => {\n  const { activeView, notification, clearNotification } = useCallContext();\n  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);\n\n  const renderActiveView = () => {\n    switch (activeView) {\n      case 'dashboard':\n        return <DashboardView />;\n      case 'queue':\n        return <QueueView />;\n      case 'analysis':\n        return <CallAnalysisView />;\n      case 'reports':\n        return <ReportsView />;\n      case 'settings':\n        return <SettingsView />;\n      default:\n        return <DashboardView />;\n    }\n  };\n\n  return (\n    <div className=\"flex h-screen w-screen overflow-hidden bg-slate-100 antialiased font-sans\">\n      {/* Desktop Sidebar */}\n      <div className=\"hidden md:flex shrink-0\">\n        <Sidebar />\n      <\/div>\n\n      {/* Mobile Drawer */}\n      {mobileSidebarOpen && (\n        <div className=\"fixed inset-0 z-50 flex md:hidden\">\n          <div \n            className=\"fixed inset-0 bg-slate-900/60 backdrop-blur-xs\"\n            onClick={() => setMobileSidebarOpen(false)}\n          />\n          <div className=\"relative z-10 flex\">\n            <Sidebar />\n            <button\n              onClick={() => setMobileSidebarOpen(false)}\n              className=\"p-2 text-white hover:text-slate-200 self-start mt-2 ml-1\"\n            >\n              <X className=\"w-6 h-6\" />\n            <\/button>\n          <\/div>\n        <\/div>\n      )}\n\n      {/* Main Workspace Frame */}\n      <div className=\"flex-1 flex flex-col min-w-0 overflow-hidden\">\n        {/* Top Header with Mobile Hamburger */}\n        <div className=\"relative flex items-center bg-white border-b border-slate-200\">\n          <button\n            onClick={() => setMobileSidebarOpen(true)}\n            className=\"md:hidden p-3 text-slate-600 hover:text-slate-900 focus:outline-none\"\n            aria-label=\"Open Navigation\"\n          >\n            <Menu className=\"w-5 h-5\" />\n          <\/button>\n          <div className=\"flex-1\">\n            <Header />\n          <\/div>\n        <\/div>\n\n        {/* Floating Toast Notification */}\n        {notification && (\n          <div className=\"fixed bottom-5 right-5 z-50 max-w-md animate-in fade-in slide-in-from-bottom-2 duration-200\">\n            <div className={`p-3.5 rounded-lg border shadow-lg flex items-start gap-3 ${\n              notification.type === 'success'\n                ? 'bg-slate-900 text-white border-slate-800'\n                : notification.type === 'warning'\n                ? 'bg-amber-50 text-amber-900 border-amber-200'\n                : 'bg-white text-slate-800 border-slate-200'\n            }`}>\n              {notification.type === 'success' ? (\n                <CheckCircle2 className=\"w-4 h-4 text-emerald-400 shrink-0 mt-0.5\" />\n              ) : notification.type === 'warning' ? (\n                <AlertTriangle className=\"w-4 h-4 text-amber-600 shrink-0 mt-0.5\" />\n              ) : (\n                <Info className=\"w-4 h-4 text-indigo-500 shrink-0 mt-0.5\" />\n              )}\n\n              <div className=\"flex-1 text-xs leading-relaxed\">\n                {notification.message}\n              <\/div>\n\n              <button\n                onClick={clearNotification}\n                className=\"text-slate-400 hover:text-slate-200 p-0.5\"\n              >\n                <X className=\"w-3.5 h-3.5\" />\n              <\/button>\n            <\/div>\n          <\/div>\n        )}\n\n        {/* Scrollable Viewport Canvas */}\n        <main className=\"flex-1 overflow-y-auto bg-slate-50\">\n          {renderActiveView()}\n        <\/main>\n      <\/div>\n    <\/div>\n  );\n};\n\nexport default function App() {\n  return (\n    <CallProvider>\n      <AppContent />\n    <\/CallProvider>\n  );\n}\n", "src/components/analysis/CallAnalysisView.tsx": "import React, { useState, useEffect } from 'react';\nimport { useCallContext } from '../../context/CallContext';\nimport { \n  Play, \n  Pause, \n  RotateCcw, \n  Volume2, \n  VolumeX, \n  AlertCircle, \n  CheckCircle2, \n  XCircle, \n  Clock, \n  User, \n  PhoneCall, \n  Wifi, \n  ShieldAlert, \n  ChevronLeft, \n  ChevronRight, \n  FileText, \n  Sparkles, \n  AlertTriangle,\n  Send,\n  Flag,\n  HelpCircle,\n  ExternalLink,\n  Info\n} from 'lucide-react';\nimport { QADecision, ReviewStatus, FlagItem } from '../../types';\n\nexport const CallAnalysisView: React.FC = () => {\n  const { \n    selectedCall, \n    calls, \n    selectCall, \n    saveQAReview, \n    setActiveView,\n    audioPlayer,\n    toggleAudioPlay,\n    seekAudio,\n    setAudioSpeed,\n    setAudioVolume\n  } = useCallContext();\n\n  // If no call is selected, fallback to first available\n  const currentCall = selectedCall || calls[0];\n\n  // Review Form local state\n  const [qaStatus, setQaStatus] = useState<ReviewStatus>(\n    currentCall?.reviewStatus === 'Pending Review' ? 'Confirmed Issue' : (currentCall?.reviewStatus || 'Pending Review')\n  );\n  const [primaryDisposition, setPrimaryDisposition] = useState<QADecision['primaryDisposition']>(\n    currentCall?.qaDecision?.primaryDisposition || 'Coaching Required'\n  );\n  const [reviewerName, setReviewerName] = useState(\n    currentCall?.qaDecision?.reviewedBy || 'Sarah Jenkins (QA Specialist)'\n  );\n  const [notes, setNotes] = useState(currentCall?.qaDecision?.notes || '');\n  const [escalationTicket, setEscalationTicket] = useState(\n    currentCall?.qaDecision?.technicalEscalationTicket || ''\n  );\n  \n  // Flag verdicts map\n  const [flagVerdicts, setFlagVerdicts] = useState<Record<string, 'Confirmed' | 'Dismissed' | 'Inconclusive'>>(() => {\n    const initial: Record<string, 'Confirmed' | 'Dismissed' | 'Inconclusive'> = {};\n    if (currentCall) {\n      currentCall.flags.forEach(f => {\n        initial[f.id] = f.humanVerdict || (currentCall.reviewStatus === 'Confirmed Issue' ? 'Confirmed' : 'Dismissed');\n      });\n    }\n    return initial;\n  });\n\n  const [evidenceTimestamps, setEvidenceTimestamps] = useState<string[]>(\n    currentCall?.qaDecision?.evidenceTimestamps || []\n  );\n  const [newTimestampText, setNewTimestampText] = useState('');\n  const [activeTab, setActiveTab] = useState<'transcript' | 'diagnostics' | 'flags'>('transcript');\n\n  // Sync state when currentCall changes\n  useEffect(() => {\n    if (currentCall) {\n      setQaStatus(currentCall.reviewStatus);\n      setPrimaryDisposition(currentCall.qaDecision?.primaryDisposition || 'Coaching Required');\n      setNotes(currentCall.qaDecision?.notes || '');\n      setEscalationTicket(currentCall.qaDecision?.technicalEscalationTicket || '');\n      setEvidenceTimestamps(currentCall.qaDecision?.evidenceTimestamps || []);\n\n      const newVerdicts: Record<string, 'Confirmed' | 'Dismissed' | 'Inconclusive'> = {};\n      currentCall.flags.forEach(f => {\n        newVerdicts[f.id] = f.humanVerdict || 'Inconclusive';\n      });\n      setFlagVerdicts(newVerdicts);\n    }\n  }, [currentCall?.id]);\n\n  if (!currentCall) {\n    return (\n      <div className=\"p-12 text-center text-slate-500\">\n        <p>No call selected for analysis.<\/p>\n        <button\n          onClick={() => setActiveView('queue')}\n          className=\"mt-4 px-4 py-2 bg-indigo-600 text-white rounded-md text-xs font-semibold\"\n        >\n          Go to Review Queue\n        <\/button>\n      <\/div>\n    );\n  }\n\n  // Previous & Next call navigation\n  const currentIndex = calls.findIndex(c => c.id === currentCall.id);\n  const prevCall = currentIndex > 0 ? calls[currentIndex - 1] : null;\n  const nextCall = currentIndex < calls.length - 1 ? calls[currentIndex + 1] : null;\n\n  const handleAddEvidenceTimestamp = () => {\n    if (!newTimestampText.trim()) {\n      // Auto-populate current audio player time\n      const min = Math.floor(audioPlayer.currentTime / 60);\n      const sec = Math.floor(audioPlayer.currentTime % 60);\n      const timeStr = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')} - Marked during review`;\n      setEvidenceTimestamps(prev => [...prev, timeStr]);\n      return;\n    }\n    setEvidenceTimestamps(prev => [...prev, newTimestampText.trim()]);\n    setNewTimestampText('');\n  };\n\n  const handleRemoveTimestamp = (idx: number) => {\n    setEvidenceTimestamps(prev => prev.filter((_, i) => i !== idx));\n  };\n\n  const handleFlagVerdictChange = (flagId: string, verdict: 'Confirmed' | 'Dismissed' | 'Inconclusive') => {\n    setFlagVerdicts(prev => ({\n      ...prev,\n      [flagId]: verdict\n    }));\n  };\n\n  const handleSaveDecision = (e: React.FormEvent) => {\n    e.preventDefault();\n\n    const decision: QADecision = {\n      reviewedBy: reviewerName,\n      reviewedAt: new Date().toISOString(),\n      status: qaStatus,\n      primaryDisposition: primaryDisposition,\n      notes: notes || 'Reviewed against standard CX call screening protocol.',\n      flagVerdicts: flagVerdicts,\n      evidenceTimestamps: evidenceTimestamps,\n      technicalEscalationTicket: escalationTicket || undefined\n    };\n\n    saveQAReview(currentCall.id, decision);\n  };\n\n  // Format seconds to mm:ss\n  const formatTime = (secs: number) => {\n    const m = Math.floor(secs / 60);\n    const s = Math.floor(secs % 60);\n    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;\n  };\n\n  return (\n    <div className=\"p-6 max-w-7xl mx-auto space-y-6\">\n      {/* Top Bar: Call Context & Next/Prev Controls */}\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200\">\n        <div className=\"flex items-center gap-3\">\n          <button\n            onClick={() => setActiveView('queue')}\n            className=\"p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-md transition-colors\"\n            title=\"Back to Queue\"\n          >\n            <ChevronLeft className=\"w-5 h-5\" />\n          <\/button>\n\n          <div>\n            <div className=\"flex items-center gap-2.5\">\n              <h1 className=\"text-xl font-bold font-mono text-slate-900\">\n                {currentCall.id}\n              <\/h1>\n              <span className={`text-xs px-2 py-0.5 rounded font-semibold ${\n                currentCall.reviewStatus === 'Confirmed Issue'\n                  ? 'bg-rose-50 text-rose-700 border border-rose-200'\n                  : currentCall.reviewStatus === 'Dismissed'\n                  ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'\n                  : currentCall.reviewStatus === 'Needs Further Review'\n                  ? 'bg-amber-50 text-amber-700 border border-amber-200'\n                  : currentCall.reviewStatus === 'Escalated'\n                  ? 'bg-purple-50 text-purple-700 border border-purple-200'\n                  : 'bg-indigo-50 text-indigo-700 border border-indigo-200'\n              }`}>\n                {currentCall.reviewStatus}\n              <\/span>\n\n              {currentCall.durationSeconds <= 30 && (\n                <span className=\"text-xs bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded font-mono\">\n                  Short Call ({currentCall.durationSeconds}s)\n                <\/span>\n              )}\n            <\/div>\n\n            <div className=\"text-xs text-slate-500 mt-1 flex flex-wrap items-center gap-2\">\n              <span className=\"font-medium text-slate-700\">Agent: {currentCall.agentName}<\/span>\n              <span>\u00b7<\/span>\n              <span>Team: {currentCall.agentTeam}<\/span>\n              <span>\u00b7<\/span>\n              <span>Customer: {currentCall.customerName} ({currentCall.customerNumber})<\/span>\n              <span>\u00b7<\/span>\n              <span>Timestamp: {currentCall.callTime}<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        {/* Previous / Next Call buttons */}\n        <div className=\"flex items-center gap-2 self-start sm:self-center\">\n          <button\n            disabled={!prevCall}\n            onClick={() => prevCall && selectCall(prevCall.id, 'analysis')}\n            className=\"inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 rounded-md hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors\"\n          >\n            <ChevronLeft className=\"w-3.5 h-3.5\" />\n            <span>Prev Call<\/span>\n          <\/button>\n\n          <span className=\"text-xs font-mono text-slate-400\">\n            {currentIndex + 1} / {calls.length}\n          <\/span>\n\n          <button\n            disabled={!nextCall}\n            onClick={() => nextCall && selectCall(nextCall.id, 'analysis')}\n            className=\"inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 rounded-md hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors\"\n          >\n            <span>Next Call<\/span>\n            <ChevronRight className=\"w-3.5 h-3.5\" />\n          <\/button>\n        <\/div>\n      <\/div>\n\n      {/* Simulated Audio Player & Waveform Visualizer */}\n      <div className=\"bg-slate-900 text-white rounded-lg p-5 space-y-4 shadow-sm border border-slate-800\">\n        <div className=\"flex items-center justify-between text-xs text-slate-400\">\n          <div className=\"flex items-center gap-2\">\n            <span className=\"uppercase font-semibold tracking-wider text-slate-300\">\n              Interactive Audio Simulation\n            <\/span>\n            <span className=\"text-slate-600\">\u00b7<\/span>\n            <span className=\"text-amber-400 font-medium\">DEMO AUDIO PLAYER<\/span>\n          <\/div>\n\n          <div className=\"flex items-center gap-3\">\n            <span>Telephony Code: <strong className=\"font-mono text-slate-200\">{currentCall.audioMetrics.carrierSipCode || 'SIP 200 OK'}<\/strong><\/span>\n            <span>\u00b7<\/span>\n            <span>Clarity: <strong className=\"font-mono text-slate-200\">{currentCall.audioMetrics.audioClarityScore}/100<\/strong><\/span>\n          <\/div>\n        <\/div>\n\n        {/* Waveform Graphic with scrubber */}\n        <div className=\"relative py-2 select-none\">\n          <div \n            onClick={(e) => {\n              const rect = e.currentTarget.getBoundingClientRect();\n              const clickFraction = (e.clientX - rect.left) / rect.width;\n              seekAudio(clickFraction * currentCall.durationSeconds);\n            }}\n            className=\"h-20 bg-slate-950/80 rounded-lg p-2.5 flex items-center justify-between gap-1 cursor-pointer border border-slate-800 hover:border-slate-700 relative overflow-hidden group\"\n          >\n            {/* Playhead Progress Overlay */}\n            <div \n              className=\"absolute top-0 bottom-0 left-0 bg-indigo-500/15 pointer-events-none transition-all duration-100 border-r-2 border-indigo-400\"\n              style={{ width: `${(audioPlayer.currentTime / Math.max(1, currentCall.durationSeconds)) * 100}%` }}\n            />\n\n            {/* Simulated Waveform Bars */}\n            {currentCall.audioWaveform.map((amp, idx) => {\n              const progressFraction = (idx / currentCall.audioWaveform.length);\n              const isPast = progressFraction <= (audioPlayer.currentTime / currentCall.durationSeconds);\n\n              return (\n                <div \n                  key={idx}\n                  className=\"flex-1 flex items-center justify-center h-full\"\n                >\n                  <div \n                    className={`w-1.5 rounded-full transition-all duration-150 ${\n                      isPast \n                        ? 'bg-indigo-400 shadow-xs' \n                        : 'bg-slate-700 group-hover:bg-slate-600'\n                    }`}\n                    style={{ height: `${Math.max(15, amp * 100)}%` }}\n                  />\n                <\/div>\n              );\n            })}\n\n            {/* Event Markers on Waveform */}\n            {currentCall.flags.map((flag) => {\n              if (flag.timestampStart === undefined) return null;\n              const posPercent = (flag.timestampStart / currentCall.durationSeconds) * 100;\n              return (\n                <div\n                  key={flag.id}\n                  onClick={(e) => {\n                    e.stopPropagation();\n                    seekAudio(flag.timestampStart || 0);\n                  }}\n                  className=\"absolute bottom-1 -translate-x-1/2 flex flex-col items-center cursor-pointer group/marker\"\n                  style={{ left: `${posPercent}%` }}\n                  title={`Jump to ${flag.category} at ${formatTime(flag.timestampStart)}`}\n                >\n                  <div className=\"w-2 h-2 rounded-full bg-rose-500 ring-2 ring-slate-900 group-hover/marker:scale-125 transition-transform\" />\n                  <span className=\"hidden group-hover/marker:block absolute -top-7 text-[10px] bg-rose-900 text-rose-100 border border-rose-700 px-1.5 py-0.5 rounded whitespace-nowrap z-30\">\n                    {flag.category} ({formatTime(flag.timestampStart)})\n                  <\/span>\n                <\/div>\n              );\n            })}\n          <\/div>\n        <\/div>\n\n        {/* Player Controls Bar */}\n        <div className=\"flex flex-col sm:flex-row items-center justify-between gap-4 pt-1\">\n          {/* Main Controls: Play, Restart, Times */}\n          <div className=\"flex items-center gap-3\">\n            <button\n              onClick={() => toggleAudioPlay(currentCall.id)}\n              className=\"w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow transition-colors\"\n              title={audioPlayer.isPlaying ? 'Pause' : 'Play'}\n            >\n              {audioPlayer.isPlaying ? (\n                <Pause className=\"w-4 h-4 fill-current\" />\n              ) : (\n                <Play className=\"w-4 h-4 fill-current ml-0.5\" />\n              )}\n            <\/button>\n\n            <button\n              onClick={() => seekAudio(0)}\n              className=\"p-2 text-slate-400 hover:text-white rounded-md transition-colors\"\n              title=\"Reset to 00:00\"\n            >\n              <RotateCcw className=\"w-4 h-4\" />\n            <\/button>\n\n            <div className=\"font-mono text-xs tabular-nums text-slate-300\">\n              <span className=\"text-white font-semibold\">{formatTime(audioPlayer.currentTime)}<\/span>\n              <span className=\"text-slate-500 mx-1\">/<\/span>\n              <span>{formatTime(currentCall.durationSeconds)}<\/span>\n            <\/div>\n          <\/div>\n\n          {/* Quick Jump to Flag Events */}\n          <div className=\"flex items-center gap-1.5 overflow-x-auto text-xs\">\n            <span className=\"text-slate-400 text-[11px] mr-1\">Jump to:<\/span>\n            {currentCall.flags.map(flag => (\n              <button\n                key={flag.id}\n                onClick={() => seekAudio(flag.timestampStart || 0)}\n                className=\"px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 text-[11px] whitespace-nowrap transition-colors\"\n              >\n                {flag.category.replace('Audio: ', '')} ({formatTime(flag.timestampStart || 0)})\n              <\/button>\n            ))}\n          <\/div>\n\n          {/* Speed & Volume Controls */}\n          <div className=\"flex items-center gap-4 text-xs\">\n            {/* Speed Selector */}\n            <div className=\"flex items-center gap-1 bg-slate-800 rounded p-0.5\">\n              {[0.75, 1.0, 1.25, 1.5].map((spd) => (\n                <button\n                  key={spd}\n                  onClick={() => setAudioSpeed(spd)}\n                  className={`px-2 py-0.5 rounded text-[11px] font-mono transition-colors ${\n                    audioPlayer.speed === spd\n                      ? 'bg-indigo-600 text-white'\n                      : 'text-slate-400 hover:text-slate-200'\n                  }`}\n                >\n                  {spd}x\n                <\/button>\n              ))}\n            <\/div>\n\n            {/* Volume Toggle */}\n            <div className=\"flex items-center gap-1.5 text-slate-400\">\n              <Volume2 className=\"w-4 h-4\" />\n              <input\n                type=\"range\"\n                min=\"0\"\n                max=\"1\"\n                step=\"0.05\"\n                value={audioPlayer.volume}\n                onChange={(e) => setAudioVolume(parseFloat(e.target.value))}\n                className=\"w-16 accent-indigo-500\"\n              />\n            <\/div>\n          <\/div>\n        <\/div>\n\n        {/* Demo Mode Audio Notice */}\n        <div className=\"text-[11px] text-slate-400 border-t border-slate-800/80 pt-2 flex items-center justify-between\">\n          <div className=\"flex items-center gap-1.5\">\n            <Info className=\"w-3.5 h-3.5 text-slate-400\" />\n            <span>Simulated playback timing synchronized with transcript and spectral events. No proprietary client audio is stored or exposed.<\/span>\n          <\/div>\n          <span className=\"font-mono text-slate-400\">DEMO MODE ACTIVE<\/span>\n        <\/div>\n      <\/div>\n\n      {/* Main Analysis Body: Dual-Pane Layout */}\n      <div className=\"grid grid-cols-1 lg:grid-cols-12 gap-6 items-start\">\n        {/* Left Column: Transcript & AI Flags & Telephony Diagnostics (7 cols) */}\n        <div className=\"lg:col-span-7 space-y-6\">\n          {/* Navigation Tabs */}\n          <div className=\"bg-white border border-slate-200 rounded-lg overflow-hidden\">\n            <div className=\"flex border-b border-slate-200 bg-slate-50 px-2 pt-2 gap-1 text-xs font-medium\">\n              <button\n                onClick={() => setActiveTab('transcript')}\n                className={`px-4 py-2 rounded-t-md transition-colors ${\n                  activeTab === 'transcript'\n                    ? 'bg-white text-slate-900 border-t border-x border-slate-200 font-semibold'\n                    : 'text-slate-600 hover:text-slate-900'\n                }`}\n              >\n                Transcript ({currentCall.transcript.length} turns)\n              <\/button>\n\n              <button\n                onClick={() => setActiveTab('flags')}\n                className={`px-4 py-2 rounded-t-md transition-colors flex items-center gap-1.5 ${\n                  activeTab === 'flags'\n                    ? 'bg-white text-slate-900 border-t border-x border-slate-200 font-semibold'\n                    : 'text-slate-600 hover:text-slate-900'\n                }`}\n              >\n                <span>AI Screening Flags<\/span>\n                <span className=\"text-[11px] bg-rose-100 text-rose-800 px-1.5 py-0.2 rounded-full font-mono\">\n                  {currentCall.flags.length}\n                <\/span>\n              <\/button>\n\n ojectZip();\n      setDownloadedZip(true);\n    } catch (e) {\n      console.error('Download failed', e);\n    } finally {\n      setDownloading(false);\n    }\n  };\n\n  const handleDownloadCSV = () => {\n    const csv = exportCallsToCSV(calls);\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement('a');\n    link.href = url;\n    link.setAttribute('download', `CallGuard_Dataset_${new Date().toISOString().slice(0, 10)}.csv`);\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  };\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-4\">\n      {/* Backdrop */}\n      <div \n        className=\"fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity\"\n        onClick={onClose}\n      />\n\n      {/* Modal Dialog */}\n      <div className=\"relative bg-white rounded-xl shadow-2xl border border-slate-200 max-w-xl w-full p-6 space-y-6 z-10 animate-in fade-in zoom-in-95 duration-150\">\n        <div className=\"flex items-start justify-between\">\n          <div className=\"flex items-center gap-3\">\n            <div className=\"w-10 h-10 rounded-lg bg-indigo-50 border border-indigo-200 flex items-center justify-center text-indigo-600\">\n              <FolderArchive className=\"w-5 h-5\" />\n            <\/div>\n            <div>\n              <h2 className=\"text-lg font-bold text-slate-900\">\n                Download Standalone Prototype\n              <\/h2>\n              <p className=\"text-xs text-slate-500 mt-0.5\">\n                Complete, fully functional codebase with all buttons, mock calls, and screening rules.\n              <\/p>\n            <\/div>\n          <\/div>\n\n          <button\n            onClick={onClose}\n            className=\"p-1.5 text-slate-400 hover:text-slate-700 rounded-md transition-colors\"\n          >\n            <X className=\" -200 flex flex-col sm:flex-row sm:items-center justify-between gap-4\">\n            <div className=\"space-y-1\">\n              <div className=\"flex items-center gap-2\">\n                <FileSpreadsheet className=\"w-4 h-4 text-emerald-600\" />\n                <span className=\"text-sm font-semibold text-slate-900\">\n                  QA Audit & Call Records (.csv)\n                <\/span>\n              <\/div>\n              <p className=\"text-xs text-slate-600\">\n                All 14 call records with timestamps, durations, and human QA verdicts in Excel/Sheets format.\n              <\/p>\n            <\/div>\n\n            <button\n              onClick={handleDownloadCSV}\n              className=\"inline-flex items-center justify-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 rounded-md shadow-xs transition-colors whitespace-nowrap shrink-0\"\n            >\n              <Download className=\"w-3.5 h-3.5\" />\n              <span>Export CSV<\/span>\n            <\/button>\n          <\/div>\n        <\/div>\n\n        {/* Localhost Setup Terminal Instructions */}\n        <div className=\"p-4 bg-slate-900 text-slate-200 rounded-lg space-y-2 text-xs\">\n          <div className=\"flex items-center justify-between text-slate-400 pb-1 border-b border-slate-800\">\n            <span className=\"font-semibold text-slate-300 flex items-center gap-1.5\">\n              <Terminal className=\"w-3.5 h-3.5 text-indigo-400\" />\n              How to Run on Localhost\n            <\/span>\n            <span className=\"font-mono text-[11px]\">Node.js v18+<\/span>\n          <\/div>\n\n          <div className=\"font-mono text-[11px] space-y-1.5 text-slate-300 pt-1\">\n            <div className=\"text-slate-400\"># 1. Unzip and navigate to folder<\/div>\n            <div className=\"text-indigo-300\">unzip CallGuard-AI-Prototype.zip<\/div>\n            <div className=\"text-slate-400 mt-2\"># 2. Install dependencies<\/div>\n            <div className=\"text-emerald-300\">npm install<\/div>\n            <div className=\"text-slate-400 mt-2\"># 3. Start local development server<\/div>\n            <div className=\"text-emerald-300\">npm run dev<\/div>\n            <div className=\"text-slate-400 mt-2\"># 4. Open in browser:<\/div>\n            <div className=\"text-white font-semibold\">http://localhost:3000<\/div>\n          <\/div>\n        <\/div>\n\n        {/* Close button */}\n        <div className=\"flex justify-end pt-2\">\n          <button\n            onClick={onClose}\n            className=\"px-4 py-1.5 text-xs font-medium text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors\"\n          >\n            Close\n          <\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n};\n", "src/components/common/Header.tsx": "import React, { useState } from 'react';\nimport { useCallContext } from '../../context/CallContext';\nimport { PhoneCall, ShieldAlert, Sparkles, RefreshCw, Plus, Download, FolderArchive } from 'lucide-react';\nimport { exportCallsToCSV } from '../../services/screeningEngine';\nimport { DownloadModal } from './DownloadModal';\n\nexport const Header: React.FC = () => {\n  const { \n    activeView, \n    setActiveView, \n    selectedCall, \n    simulateNewCall, \n    filteredCalls, \n    calls \n  } = useCallContext();\n\n  const [downloadModalOpen, setDownloadModalOpen] = useState(false);\n\n  const handleExportCSV = () => {\n    const csv = exportCallsToCSV(filteredCalls.length > 0 ? filteredCalls : calls);\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement('a');\n    link.href = url;\n    link.setAttribute('download', `CallGuard_QA_Report_${new Date().toISOString().slice(0, 10)}.csv`);\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  };\n\n  const getViewBreadcrumb = () => {\n    switch (activeView) {\n      case 'dashboard':\n        return 'Overview & Issue Trends';\n      case 'queue':\n        return 'Review Queue';\n      case 'analysis':\n        return selectedCall ? `Call Analysis / ${selectedCall.id}` : 'Call Analysis';\n      case 'reports':\n        return 'QA Outcomes & Analytics';\n      case 'settings':\n        return 'Screening Rules & Criteria';\n      default:\n        return 'Workspace';\n    }\n  };\n\n  return (\n    <>\n      <header className=\"h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between gap-8 shrink-0 z-20\">\n        {/* Zone 1: Brand Wordmark & Context Breadcrumb */}\n        <div className=\"flex items-center gap-4 min-w-0\">\n          <a \n            href=\"#dashboard\" \n            onClick={(e) => { e.preventDefault(); setActiveView('dashboard'); }}\n            className=\"text-lg font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0 flex items-center gap-2 hover:text-indigo-600 transition-colors\"\n          >\n            <div className=\"w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-sm\">\n              <ShieldAlert className=\"w-4 h-4\" />\n            <\/div>\n            CallGuard AI\n          <\/a>\n\n          <div className=\"hidden sm:flex items-center gap-2 text-xs text-slate-500 truncate\">\n            <span className=\"text-slate-300\">/<\/span>\n            <span className=\"font-medium text-slate-700 truncate\">{getViewBreadcrumb()}<\/span>\n          <\/div>\n        <\/div>\n\n        {/* Zone 2: DEMO MODE Advisory & Contextual Metadata */}\n        <div className=\"hidden lg:flex items-center gap-3\">\n          <div className=\"flex items-center gap-2 bg-amber-50 border border-amber-200/80 rounded-md px-3 py-1.5 text-xs text-amber-800\">\n            <Sparkles className=\"w-3.5 h-3.5 text-amber-600 shrink-0\" />\n            <span className=\"font-medium\">DEMO MODE<\/span>\n            <span className=\"text-amber-400\">\u00b7<\/span>\n            <span className=\"text-amber-700\">Simulated AI screening \u00b7 Human QA holds final authority<\/span>\n          <\/div>\n        <\/div>\n\n        {/* Zone 3: Primary Actions */}\n        <div className=\"flex items-center gap-2.5 shrink-0\">\n          <button\n            onClick={() => setDownloadModalOpen(true)}\n            className=\"inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-md shadow-xs transition-colors whitespace-nowrap\"\n            title=\"Download complete working prototype ZIP\"\n          >\n            <Download className=\"w-3.5 h-3.5\" />\n            <span>Download Prototype<\/span>\n          <\/button>\n\n          <button\n            onClick={handleExportCSV}\n            className=\"hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors whitespace-nowrap\"\n            title=\"Download current filtered calls as CSV\"\n          >\n            <span>Export CSV<\/span>\n          <\/button>\n\n          <button\n            onClick={simulateNewCall}\n            className=\"inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-md shadow-sm transition-colors whitespace-nowrap\"\n          >\n            <Plus className=\"w-3.5 h-3.5\" />\n            <span>Simulate Call<\/span>\n          <\/button>\n        <\/div>\n      <\/header>\n\n      {/* Download Modal */}\n      <DownloadModal\n        isOpen={downloadModalOpen}\n        onClose={() => setDownloadModalOpen(false)}\n      />\n    <\/>\n  );\n};\n\n", "src/components/common/Sidebar.tsx": "import React, { useState } from 'react';\nimport { useCallContext, AppView } from '../../context/CallContext';\nimport { \n  LayoutDashboard, \n  ListFilter, \n  Headphones, \n  BarChart3, \n  Sliders, \n  RotateCcw, \n  CheckCircle2, \n  Info,\n  Download,\n  FolderArchive\n} from 'lucide-react';\nimport { DownloadModal } from './DownloadModal';\n\nexport const Sidebar: React.FC = () => {\n  const { \n    activeView, \n    setActiveView, \n    calls, \n    selectedCall, \n    resetDemoData, \n    rescreenAllCalls \n  } = useCallContext();\n\n  const [downloadModalOpen, setDownloadModalOpen] = useState(false);\n\n  const pendingCount = calls.filter(c => c.reviewStatus === 'Pending Review').length;\n  const shortCallsCount = calls.filter(c => c.durationSeconds <= 30).length;\n\n  const navItems: { view: AppView; label: string; icon: React.ReactNode; badge?: number | string }[] = [\n    {\n      view: 'dashboard',\n      label: 'Dashboard',\n      icon: <LayoutDashboard className=\"w-4 h-4\" />\n    },\n    {\n      view: 'queue',\n      label: 'Review Queue',\n      icon: <ListFilter className=\"w-4 h-4\" />,\n      badge: pendingCount > 0 ? pendingCount : undefined\n    },\n    {\n      view: 'analysis',\n      label: 'Call Analysis',\n      icon: <Headphones className=\"w-4 h-4\" />,\n      badge: selectedCall ? selectedCall.id.replace('CALL-', '#') : undefined\n    },\n    {\n      view: 'reports',\n      label: 'QA Reports',\n      icon: <BarChart3 className=\"w-4 h-4\" />\n    },\n    {\n      view: 'settings',\n      label: 'Rules & Settings',\n      icon: <Sliders className=\"w-4 h-4\" />\n    }\n  ];\n\n  return (\n    <>\n      <aside className=\"w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 border-r border-slate-800 select-none\">\n        {/* System Identity Banner */}\n        <div className=\"p-4 border-b border-slate-800\">\n          <div className=\"text-xs uppercase tracking-wider font-semibold text-slate-400\">\n            CX Quality Assurance\n          <\/div>\n          <div className=\"text-sm font-medium text-white mt-0.5\">\n            Associate Call Screening\n          <\/div>\n          <div className=\"mt-2 text-xs text-slate-400 flex items-center justify-between\">\n            <span>Active dataset<\/span>\n            <span className=\"font-mono text-slate-200\">{calls.length} calls<\/span>\n          <\/div>\n        <\/div>\n\n        {/* Navigation Links */}\n        <nav className=\"flex-1 px-3 py-4 space-y-1\">\n          {navItems.map((item) => {\n            const isActive = activeView === item.view;\n            return (\n              <button\n                key={item.view}\n                onClick={() => setActiveView(item.view)}\n                className={`w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg transition-colors text-left ${\n                  isActive\n                    ? 'bg-indigo-600 text-white shadow-sm'\n                    : 'text-slate-300 hover:bg-slate-800/80 hover:text-white'\n                }`}\n              >\n                <div className=\"flex items-center gap-3 truncate\">\n                  <span className={isActive ? 'text-white' : 'text-slate-400'}>\n                    {item.icon}\n                  <\/span>\n                  <span className=\"truncate\">{item.label}<\/span>\n                <\/div>\n                {item.badge !== undefined && (\n                  <span\n                    className={`text-xs px-2 py-0.5 rounded-full font-mono ${\n                      isActive \n                        ? 'bg-indigo-500 text-white' \n                        : 'bg-slate-800 text-slate-300 border border-slate-700'\n                    }`}\n                  >\n                    {item.badge}\n                  <\/span>\n                )}\n              <\/button>\n            );\n          })}\n        <\/nav>\n\n        {/* QA Policy Safeguard Notice */}\n        <div className=\"p-3 mx-3 mb-3 bg-slate-800/60 rounded-lg border border-slate-800 text-xs text-slate-300\">\n          <div className=\"flex items-start gap-2\">\n            <Info className=\"w-4 h-4 text-indigo-400 shrink-0 mt-0.5\" />\n            <div className=\"space-y-1\">\n              <p className=\"font-medium text-slate-200\">Safeguard Policy<\/p>\n              <p className=\"text-slate-400 text-[11px] leading-relaxed\">\n                Call duration alone must never be treated as proof of intentional disconnect. Always inspect carrier SIP signals and customer context.\n              <\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        {/* Footer Controls & Reset */}\n        <div className=\"p-3 border-t border-slate-800 space-y-2\">\n          <button\n            onClick={() => setDownloadModalOpen(true)}\n            className=\"w-full flex items-center justify-center gap-2 px-3 py-1.5 text-xs font-semibold text-indigo-200 hover:text-white bg-indigo-900/60 hover:bg-indigo-800 border border-indigo-700/60 rounded-md transition-colors\"\n          >\n            <Download className=\"w-3.5 h-3.5 text-indigo-400\" />\n            <span>Download Prototype<\/span>\n          <\/button>\n\n          <button\n            onClick={rescreenAllCalls}\n            className=\"w-full flex items-center justify-center gap-2 px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-md transition-colors\"\n          >\n            <span>Re-screen All Calls<\/span>\n          <\/button>\n\n          <button\n            onClick={resetDemoData}\n            className=\"w-full flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200 transition-colors\"\n          >\n            <RotateCcw className=\"w-3 h-3\" />\n            <span>Reset Demo Data<\/span>\n          <\/button>\n        <\/div>\n      <\/aside>\n\n      <DownloadModal\n        isOpen={downloadModalOpen}\n        onClose={() => setDownloadModalOpen(false)}\n      />\n    <\/>\n  );\n};\n\n", "src/components/dashboard/DashboardView.tsx": "import React from 'react';\nimport { useCallContext } from '../../context/CallContext';\nimport { \n  PhoneCall, \n  Clock, \n  AlertCircle, \n  CheckCircle2, \n  XCircle, \n  VolumeX, \n  ArrowRight,\n  TrendingUp,\n  ShieldAlert,\n  ChevronRight,\n  Sparkles\n} from 'lucide-react';\n\nexport const DashboardView: React.FC = () => {\n  const { \n    calls, \n    selectCall, \n    setActiveView, \n    setFilters \n  } = useCallContext();\n\n  const totalCalls = calls.length;\n  const shortCalls = calls.filter(c => c.durationSeconds <= 30);\n  const pendingReview = calls.filter(c => c.reviewStatus === 'Pending Review');\n  const confirmedIssues = calls.filter(c => c.reviewStatus === 'Confirmed Issue');\n  const dismissedFlags = calls.filter(c => c.reviewStatus === 'Dismissed');\n  \n  const audioIssues = calls.filter(c => \n    c.flags.some(f => f.category.startsWith('Audio:'))\n  );\n\n  const echoCount = calls.filter(c => c.flags.some(f => f.category === 'Audio: Echo')).length;\n  const noiseCount = calls.filter(c => c.flags.some(f => f.category === 'Audio: Background Noise')).length;\n  const choppyCount = calls.filter(c => c.flags.some(f => f.category === 'Audio: Choppy / Packet Loss')).length;\n  const greetingIssues = calls.filter(c => \n    c.flags.some(f => f.category === 'Missing Answer Phrase' || f.category === 'Delayed Answer Phrase')\n  ).length;\n  const disconnectIssues = calls.filter(c => \n    c.flags.some(f => f.category === 'Potential Disconnect')\n  ).length;\n\n  const handleFilterToQueue = (status?: string, flagCategory?: string) => {\n    setFilters(prev => ({\n      ...prev,\n      statusFilter: status || 'All',\n      flagFilter: flagCategory || 'All'\n    }));\n    setActiveView('queue');\n  };\n\n  const highPriorityPending = pendingReview\n    .filter(c => c.priority === 'High' || c.priority === 'Medium')\n    .slice(0, 5);\n\n  const recentDecisions = calls\n    .filter(c => c.qaDecision)\n    .slice(0, 4);\n\n  return (\n    <div className=\"p    <\/p>\n        <\/div>\n\n        <div className=\"flex items-center gap-3\">\n          <button\n            onClick={handleExportCSV}\n            className=\"inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 rounded-md shadow-sm transition-colors\"\n          >\n            <Download className=\"w-3.5 h-3.5\" />\n            <span>Export CSV<\/span>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      {/* Filter and Search Bar */}\n      <div className=\"bg-white border border-slate-200 rounded-lg p-4 space-y-4 shadow-xs\">\n        {/* Row 1: Search & Segmented Status Controls */}\n        <div className=\"flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4\">\n          {/* Search Input */}\n          <div className=\"relative flex-1 max-w-md\">\n            <Search className=\"w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2\" />\n            <input\n              type=\"text\"\n              placeholder=\"Search by Agent name, Call ID, or keyword...\"\n              value={filters.searchQuery}\n              onChange={(e) => setFilters(prev => ({ ...prev, searchQuery: e.target.value }))}\n              className=\"w-full pl-9 pr-3 py-2 text-xs text-slate-900 placeholder:text-slate-400 bg-slate-50 border border-slate-200 rounded-md focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500\"\n            />\n          <\/div>\n\n          {/* Segmented Status Buttons */}\n          <div className=\"flex items-center gap-1 p-1 bg-slate-100 rounded-md overflow-x-auto text-xs font-medium\">\n            {statusOptions.map(opt => {\n              const isActive = filters.statusFilter === opt;\n              const count = opt === 'All' \n                ? calls.length \n                : calls.filter(c => c.reviewStatus === opt).length;\n\n              return (\n                <button\n                  key={opt}\n                  onClick={() => setFilters(prev => ({ ...prev, statusFilter: opt }))}\n                  className={`px-3 py-1.5 rounded transition-colors whitespace-nowrap ${\n                    isActive\n                      ? 'bg-white text-slate-900 shadow-xs font-semibold'\n                      : 'text-slate-600 hover:text-slate-900'\n                  }`}\n                >\n                  {opt} ({count})\n                <\/button>\n              );\n            })}\n          <\/div>\n        <\/div>\n\n        {/* Row 2: Secondary Filters & Toggles */}\n        <div className=\"pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-xs\">\n          <div className=\"flex flex-wrap items-center gap-3\">\n            {/* Flag category filter */}\n            <div className=\"flex items-center gap-1.5\">\n              <span className=\"text-slate-500\">Flag Type:<\/span>\n              <select\n                value={filters.flagFilter}\n                onChange={(e) => setFilters(prev => ({ ...prev, flagFilter: e.target.value }))}\n                className=\"bg-slate-50 border border-slate-200 rounded px-2.5 py-1 text-slate-700 focus:outline-none focus:border-indigo-500\"\n              >\n                {flagCategories.map(cat => (\n                  <option key={cat} value={cat}>{cat}<\/option>\n                ))}\n              <\/select>\n            <\/div>\n\n            {/* Duration Bucket */}\n            <div className=\"flex items-center gap-1.5\">\n              <span className=\"text-slate-500\">Duration:<\/span>\n              <select\n                value={filters.durationBucket}\n                onChange={(e) => setFilters(prev => ({ ...prev, durationBucket: e.target.value as any }))}\n                className=\"bg-slate-50 border border-slate-200 rounded px-2.5 py-1 text-slate-700 focus:outline-none focus:border-indigo-500\"\n              >\n                <option value=\"All\">All Durations<\/option>\n                <option value=\"0-15s\">0\u201315s (Ultra-short)<\/option>\n                <option value=\"16-30s\">16\u201330s (Short)<\/option>\n                <option value=\"31-60s\">31\u201360s (Medium)<\/option>\n                <option value=\">60s\">&gt;60s (Full Length)<\/option>\n              <\/select>\n            <\/div>\n\n            {/* Priority */}\n            <div className=\"flex items-center gap-1.5\">\n              <span className=\"text-slate-500\">Priority:<\/span>\n              <select\n                value={filters.priorityFilter}\n                onChange={(e) => setFilters(prev => ({ ...prev, priorityFilter: e.target.value as any }))}\n                className=\"bg-slate-50 border border-slate-200 rounded px-2.5 py-1 text-slate-700 focus:outline-none focus:border-indigo-500\"\n              >\n                <option value=\"All\">All Priorities<\/option>\n                <option value=\"High\">High Priority<\/option>\n                <option value=\"Medium\">Medium Priority<\/option>\n                <option value=\"Low\">Low Priority<\/option>\n              <\/select>\n            <\/div>\n\n            {/* Certainty Filter */}\n            <div className=\"flex items-center gap-1.5\">\n              <span className=\"text-slate-500\">Certainty:<\/span>\n              <select\n                value={filters.certaintyFilter}\n                onChange={(e) => setFilters(prev => ({ ...prev, certaintyFilter: e.target.value as any }))}\n                className=\"bg-slate-50 border border-slate-200 rounded px-2.5 py-1 text-slate-700 focus:outline-none focus:border-indigo-500\"\n              >\n                <option value=\"All\">All Certainty<\/option>\n                <option value=\"High\">High Confidence<\/option>\n                <option value=\"Moderate\">Moderate<\/option>\n                <option value=\"Inconclusive\">Inconclusive / Uncertain<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n\n          {/* Reset Filters button */}\n          <button\n            onClick={resetFilters}\n            className=\"flex items-center gap-1 text-slate-500 hover:text-slate-900 transition-colors\"\n          >\n            <RotateCcw className=\"w-3.5 h-3.5\" />\n            <span>Reset filters<\/span>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      {/* Main Data Table */}\n      <div className=\"bg-white border border-slate-200 rounded-lg overflow-hidden shadow-xs\">\n        <div className=\"overflow-x-auto\">\n          <table className=\"w-full text-left border-collapse\">\n            <thead>\n              <tr className=\"bg-slate-50 border-b border-slate-200 text-[11px] font-semibold text-slate-500 uppercase tracking-wider\">\n                <th \n                  onClick={() => handleSort('id')}\n                  className=\"py-3 px-4 cursor-pointer hover:text-slate-800\"\n                >\n                  <div className=\"flex items-center gap-1\">\n                    <span>Call ID<\/span>\n                    <ArrowUpDown className=\"w-3 h-3\" />\n                  <\/div>\n                <\/th>\n                <th className=\"py-3 px-4\">Agent Name<\/th>\n                <th \n                  onClick={() => handleSort('durationSeconds')}\n                  className=\"py-3 px-4 cursor-pointer hover:text-slate-800\"\n                >\n                  <div className=\"flex items-center gap-1\">\n                    <span>Duration<\/span>\n                    <ArrowUpDown className=\"w-3 h-3\" />\n                  <\/div>\n                <\/th>\n                <th className=\"py-3 px-4\">Answer Phrase<\/th>\n                <th className=\"py-3 px-4\">Detected Flags<\/th>\n                <th className=\"py-3 px-4\">Certainty<\/th>\n                <th \n                  onClick={() => handleSort('priority')}\n                  className=\"py-3 px-4 cursor-pointer hover:text-slate-800\"\n                >\n                  <div className=\"flex items-center gap-1\">\n                    <span>Priority<\/span>\n                    <ArrowUpDown className=\"w-3 h-3\" />\n                  <\/div>\n                <\/th>\n                <th className=\"py-3 px-4\">QA Status<\/th>\n                <th className=\"py-3 px-4 text-right\">Action<\/th>\n              <\/tr>\n            <\/thead>\n\n            <tbody className=\"divide-y divide-slate-100 text-xs\">\n              {filteredCalls.length === 0 ? (\n                <tr>\n                  <td colSpan={9} className=\"py-12 text-center text-slate-400\">\n                    <p className=\"font-medium text-slate-600\">No calls match your active filter criteria<\/p>\n                    <p className=\"text-xs text-slate-400 mt-1\">Try relaxing your search query or status filter.<\/p>\n                    <button\n                      onClick={resetFilters}\n                      className=\"mt-3 px-3 py-1.5 text-xs font-medium text-indigo-600 hover:text-indigo-800 bg-indigo-50 rounded\"\n                    >\n                      Clear All Filters\n                    <\/button>\n                  <\/td>\n                <\/tr>\n              ) : (\n                filteredCalls.map((call) => {\n                  const isShort = call.durationSeconds <= 30;\n\n                  return (\n                    <tr\n                      key={call.id}\n                      onClick={() => selectCall(call.id, 'analysis')}\n                      className=\"hover:bg-slate-50/80 cursor-pointer transition-colors group\"\n                    >\n                      {/* Call ID & Timestamp */}\n                      <td className=\"py-3 px-4 font-mono font-medium text-slate-900 whitespace-nowrap\">\n                        <div>{call.id}<\/div>\n                        <div className=\"text-[11px] text-slate-400 font-sans\">{call.callTime}<\/div>\n                      <\/td>\n\n                      {/* Agent & Team */}\n                      <td className=\"py-3 px-4\">\n                        <div className=\"font-medium text-slate-800\">{call.agentName}<\/div>\n                        <div className=\"text-[11px] text-slate-400 truncate max-w-[140px]\">{call.agentTeam}<\/div>\n                      <\/td>\n\n                      {/* Duration */}\n                      <td className=\"py-3 px-4 font-mono tabular-nums whitespace-nowrap\">\n                        <div className=\"flex items-center gap-2\">\n                          <span className={`font-semibold ${isShort ? 'text-amber-600' : 'text-slate-700'}`}>\n                            {call.durationSeconds}s\n                          <\/span>\n                          {isShort && (\n                            <span className=\"text-[10px] text-amber-700 bg-amber-50 border border-amber-200 px-1.5 rounded\">\n                              Short\n                            <\/span>\n                          )}\n                        <\/div>\n                      <\/td>\n\n                      {/* Answer Phrase */}\n                      <td className=\"py-3 px-4 whitespace-nowrap\">\n                        {call.answerPhraseMatched ? (\n                          <div className=\"space-y-0.5\">\n                            <span className=\"text-emerald-700 font-medium\">Delivered<\/span>\n                            <div className=\"text-[11px] text-slate-500 font-mono\">\n                              at {call.answerPhraseTimestamp?.toFixed(1)}s\n                            <\/div>\n                          <\/div>\n                        ) : (\n                          <div className=\"space-y-0.5\">\n                            <span className=\"text-rose-600 font-medium\">Missing / Non-standard<\/span>\n                            {call.answerPhraseTimestamp && (\n                              <div className=\"text-[11px] text-amber-600 font-mono\">\n                                Delayed ({call.answerPhraseTimestamp.toFixed(1)}s)\n                              <\/div>\n                            )}\n                          <\/div>\n                        )}\n                      <\/td>\n\n                      {/* Detected Flags */}\n                      <td className=\"py-3 px-4\">\n                        {call.flags.length === 0 ? (\n                          <span className=\"text-emerald-600 font-medium\">Clean \u00b7 No flags<\/span>\n                        ) : (\n                          <div className=\"flex flex-wrap gap-1 max-w-xs\">\n                            {call.flags.slice(0, 2).map(flag => (\n                              <span \n                                key={flag.id}\n                                className=\"inline-block text-[11px] bg-slate-100 text-slate-700 border border-slate-200 px-1.5 py-0.5 rounded truncate max-w-[150px]\"\n                                title={flag.title}\n                              >\n                                {flag.category}\n                              <\/span>\n                            ))}\n                            {call.flags.length > 2 && (\n                              <span className=\"text-[10px] text-slate-400 self-center\">\n                                +{call.flags.length - 2} more\n                              <\/span>\n                            )}\n                          <\/div>\n                        )}\n                      <\/td>\n\n                      {/* Certainty / Confidence */}\n                      <td className=\"py-3 px-4 whitespace-nowrap\">\n                        <div className=\"flex items-center gap-1.5\">\n                          <span className={`font-medium ${\n                            call.overallCertainty === 'High' \n                              ? 'text-slate-700' \n                              : call.overallCertainty === 'Moderate'\n                              ? 'text-amber-700'\n                              : 'text-purple-700'\n                          }`}>\n                            {call.overallCertainty}\n                          <\/span>\n                          {call.overallCertainty === 'Inconclusive' && (\n                            <span className=\"text-[10px] text-purple-700 bg-purple-50 px-1.5 py-0.2 rounded border border-purple-200\">\n                              Advisory\n                            <\/span>\n                          )}\n                        <\/div>\n                      <\/td>\n\n                      {/* Priority */}\n                      <td className=\"py-3 px-4 whitespace-nowrap\">\n                        {getPriorityBadge(call.priority)}\n                      <\/td>\n\n                      {/* QA Review Status */}\n                      <td className=\"py-3 px-4 whitespace-nowrap\">\n                        {getStatusBadge(call.reviewStatus)}\n                      <\/td>\n\n                      {/* Open Action */}\n                      <td className=\"py-3 px-4 text-right whitespace-nowrap\">\n                        <button\n                          onClick={(e) => {\n                            e.stopPropagation();\n                            selectCall(call.id, 'analysis');\n                          }}\n                          className=\"inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 rounded transition-colors\"\n                        >\n                          <Headphones className=\"w-3.5 h-3.5\" />\n                          <span>Review<\/span>\n                        <\/button>\n                      <\/td>\n                    <\/tr>\n                  );\n                })\n              )}\n            <\/tbody>\n          <\/table>\n        <\/div>\n\n        {/* Table Footer with Summary */}\n        <div className=\"p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500\">\n          <div>\n            Showing <strong className=\"text-slate-700\">{filteredCalls.length}<\/strong> of <strong className=\"text-slate-700\">{calls.length}<\/strong> calls\n          <\/div>\n          <div className=\"text-[11px] text-slate-400\">\n            Click any row to open audio waveform, transcript sync, and QA decision form\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  );\n};\n", "src/components/reports/ReportsView.tsx": "import React, { useState } from 'react';\nimport { useCallContext } from '../../context/CallContext';\nimport { \n  BarChart3, \n  Download, \n  CheckCircle2, \n  XCircle, \n  AlertTriangle, \n  ShieldCheck, \n  Users, \n  FileSpreadsheet, \n  Sparkles, \n  Filter,\n  PieChart\n} from 'lucide-react';\nimport { exportCallsToCSV } from '../../services/screeningEngine';\n\nexport const ReportsView: React.FC = () => {\n  const { calls, selectCall } = useCallContext();\n\n  const [dateFilter, setDateFilter] = useState<'All' | 'Today' | 'This Week'>('All');\n  const [teamFilter, setTeamFilter] = useState<string>('All');\n\n  // Filtered dataset for reports\n  const reportCalls = calls.filter(c => {\n    if (teamFilter !== 'All' && c.agentTeam !== teamFilter) return false;\n    return true;\n  });\n\n  const totalScreened = reportCalls.length;\n  const reviewedCalls = reportCalls.filter(c => c.reviewStatus !== 'Pending Review');\n  const reviewCompletionRate = Math.round((reviewedCalls.length / Math.max(1, totalScreened)) * 100);\n\n  const confirmedCount = reportCalls.filter(c => c.reviewStatus === 'Confirmed Issue').length;\n  const dismissedCount = reportCalls.filter(c => c.reviewStatus === 'Dismissed').length;\n  const inconclusiveCount = reportCalls.filter(c => c.reviewStatus === 'Needs Further Review').length;\n  const escalatedCount = reportCalls.filter(c => c.reviewStatus === 'Escalated').length;\n\n  // Short call duration statistics\n  const under10s = reportCalls.filter(c => c.durationSeconds <= 10).length;\n  const range11to20s = reportCalls.filter(c => c.durationSeconds > 10 && c.durationSeconds <= 20).length;\n  const range21to30s = reportCalls.filter(c => c.durationSeconds > 20 && c.durationSeconds <= 30).length;\n  const over30s = reportCalls.filter(c => c.durationSeconds > 30).length;\n\n  // Agent level summaries aggregation\n  const agentMap: Record<string, {\n    agentId: string;\n    agentName: string;\n    team: string;\n    total: number;\n    shortCalls: number;\n    reviewed: number;\n    confirmed: number;\n    dismissed: number;\n  }> = {};\n\n  reportCalls.forEach(call => {\n    if (!agentMap[call.agentName]) {\n      agentMap[call.agentName] = {\n        agentId: call.agentId,\n        agentName: call.agentName,\n        team: call.agentTeam,\n        total: 0,\n        shortCalls: 0,\n        reviewed: 0,\n        confirmed: 0,\n        dismissed: 0\n      };\n    }\n    const entry = agentMap[call.agentName];\n    entry.total += 1;\n    if (call.durationSeconds <= 30) entry.shortCalls += 1;\n    if (call.reviewStatus !== 'Pending Review') entry.reviewed += 1;\n    if (call.reviewStatus === 'Confirmed Issue') entry.confirmed += 1;\n    if (call.reviewStatus === 'Dismissed') entry.dismissed += 1;\n  });\n\n  const agentSummaries = Object.values(agentMap);\n\n  const handleExportCSV = () => {\n    const csv = exportCallsToCSV(reportCalls);\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement('a');\n    link.href = url;\n    link.setAttribute('download', `CallGuard_QA_Summary_Report_${new Date().toISOString().slice(0, 10)}.csv`);\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  };\n\n  const handleExportJSON = () => {\n    const jsonStr = JSON.stringify(reportCalls, null, 2);\n    const blob = new Blob([jsonStr], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const link = document.createElement('a');\n    link.href = url;\n    link.setAttribute('download', `CallGuard_Dataset_${new Date().toISOString().slice(0, 10)}.json`);\n    document.body.appendChild(link);\n    link.click();\n    document.body.removeChild(link);\n  };\n\n  return (\n    <div className=\"p-8 max-w-7xl mx-auto space-y-8\">\n      {/* Title & Controls */}\n      <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-4\">\n        <div>\n          <h1 className=\"text-2xl font-bold tracking-tight text-slate-900\">\n            QA Reports & Outcome Audit\n          <\/h1>\n          <p className=\"text-sm text-slate-500 mt-1\">\n            Reconciliation of automated AI screening flags against human QA reviewer decisions.\n          <\/p>\n        <\/div>\n\n        <div className=\"flex items-center gap-2.5\">\n          <button\n            onClick={handleExportCSV}\n            className=\"inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 rounded-md shadow-xs transition-colors\"\n          >\n            <Download className=\"w-3.5 h-3.5\" />\n            <span>Export CSV<\/span>\n          <\/button>\n\n          <button\n            onClick={handleExportJSON}\n            className=\"inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 rounded-md shadow-xs transition-colors\"\n          >\n            <FileSpreadsheet className=\"w-3.5 h-3.5\" />\n            <span>Export JSON<\/span>\n          <\/button>\n        <\/div>\n      <\/div>\n\n      {/* Filter strip */}\n      <div className=\"bg-white border border-slate-200 rounded-lg p-3.5 flex flex-wrap items-center justify-between gap-4 text-xs\">\n        <div className=\"flex items-center gap-4\">\n          <div className=\"flex items-center gap-2\">\n            <span className=\"text-slate-500 font-medium\">Reporting Range:<\/span>\n            <select\n              value={dateFilter}\n              onChange={(e) => setDateFilter(e.target.value as any)}\n              className=\"bg-slate-50 border border-slate-200 rounded px-2.5 py-1 text-slate-700\"\n            >\n              <option value=\"All\">All Screened Calls<\/option>\n              <option value=\"Today\">Today (Current Shift)<\/option>\n              <option value=\"This Week\">This Week (Trailing 7 Days)<\/option>\n            <\/select>\n          <\/div>\n\n          <div className=\"flex items-center gap-2\">\n            <span className=\"text-slate-500 font-medium\">Team Department:<\/span>\n            <select\n              value={teamFilter}\n              onChange={(e) => setTeamFilter(e.target.value)}\n              className=\"bg-slate-50 border border-slate-200 rounded px-2.5 py-1 text-slate-700\"\n            >\n              <option value=\"All\">All Teams<\/option>\n              <option value=\"Tier 1 Consumer Support\">Tier 1 Consumer Support<\/option>\n              <option value=\"Order Modifications\">Order Modifications<\/option>\n              <option value=\"Technical Support\">Technical Support<\/option>\n              <option value=\"Enterprise Accounts\">Enterprise Accounts<\/option>\n            <\/select>\n          <\/div>\n        <\/div>\n\n        <div className=\"text-xs text-slate-500\">\n          Audited calls: <strong className=\"text-slate-800 font-mono\">{reviewedCalls.length}<\/strong> / <span className=\"font-mono\">{totalScreened}<\/span> ({reviewCompletionRate}% audited)\n        <\/div>\n      <\/div>\n\n      {/* Distinction Section: AI Flags vs Human Confirmed Outcomes */}\n      <div className=\"bg-white border border-slate-200 rounded-lg p-6 space-y-6\">\n        <div className=\"flex items-center justify-between\">\n          <div>\n            <h2 className=\"text-base font-semibold text-slate-900\">\n              AI Advisory Screening vs Human QA Confirmed ved, customer hung up).\n            <\/p>\n          <\/div>\n\n          {/* Inconclusive / Needs Review */}\n          <div className=\"p-4 bg-amber-50/60 border border-amber-200 rounded-lg\">\n            <div className=\"flex items-center justify-between text-xs text-amber-800 font-medium\">\n              <span>Needs Further Review<\/span>\n              <AlertTriangle className=\"w-4 h-4 text-amber-600\" />\n            <\/div>\n            <div className=\"text-2xl font-bold font-mono text-amber-700 mt-2\">\n              {inconclusiveCount}\n            <\/div>\n            <p className=\"text-[11px] text-amber-600/80 mt-1\">\n              Low audio gain or insufficient evidence to infer intent.\n            <\/p>\n          <\/div>\n\n          {/* Technical Escalations */}\n          <div className=\"p-4 bg-purple-50/60 border border-purple-200 rounded-lg\">\n            <div className=\"flex items-center justify-between text-xs text-purple-800 font-medium\">\n              <span>Carrier / Tech Escalations<\/span>\n              <ShieldCheck className=\"w-4 h-4 text-purple-600\" />\n            <\/div>\n            <div className=\"text-2xl font-bold font-mono text-purple-700 mt-2\">\n              {escalatedCount}\n            <\/div>\n            <p className=\"text-[11px] text-purple-600/80 mt-1\">\n              Network SIP 487/503 drops routed to Telecom IT team.\n            <\/p>\n          <\/div>\n        <\/div>\n\n        {/* Visual Progress Bar Ratio */}\n        <div className=\"space-y-1.5 pt-2\">\n          <div className=\"flex justify-between text-xs text-slate-600\">\n            <span>Reviewed Disposition Breakdown ({reviewedCalls.length} completed calls)<\/span>\n            <span className=\"font-mono text-slate-500\">{reviewedCalls.length} of {totalScreened}<\/span>\n          <\/div>\n          <div className=\"h-3 w-full bg-slate-100 rounded-full overflow-hidden flex\">\n            {confirmedCount > 0 && (\n              <div \n                className=\"h-full bg-rose-500\" \n                style={{ width: `${(confirmedCount / Math.max(1, reviewedCalls.length)) * 100}%` }}\n                title={`Confirmed: ${confirmedCount}`}\n              />\n            )}\n            {dismissedCount > 0 && (\n              <div \n                className=\"h-full bg-emerald-500\" \n                style={{ width: `${(dismissedCount / Math.max(1, reviewedCalls.length)) * 100}%` }}\n                title={`Dismissed: ${dismissedCount}`}\n              />\n            )}\n            {inconclusiveCount > 0 && (\n              <div \n                className=\"h-full bg-amber-400\" \n                style={{ width: `${(inconclusiveCount / Math.max(1, reviewedCalls.length)) * 100}%` }}\n                title={`Needs Review: ${inconclusiveCount}`}\n              />\n            )}\n            {escalatedCount > 0 && (\n              <div \n                className=\"h-full bg-purple-500\" \n                style={{ width: `${(escalatedCount / Math.max(1, reviewedCalls.length)) * 100}%` }}\n                title={`Escalated: ${escalatedCount}`}\n              />\n            )}\n          <\/div>\n          <div className=\"flex items-center justify-between text-[11px] text-slate-500 pt-1\">\n            <div className=\"flex items-center gap-4\">\n              <span className=\"flex items-center gap-1\"><span className=\"w-2.5 h-2.5 rounded-full bg-rose-500 inline-block\"/> Confirmed<\/span>\n              <span className=\"flex items-center gap-1\"><span className=\"w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block\"/> Dismissed<\/span>\n              <span className=\"flex items-center gap-1\"><span className=\"w-2.5 h-2.5 rounded-full bg-amber-400 inline-block\"/> Inconclusive<\/span>\n              <span className=\"flex items-center gap-1\"><span className=\"w-2.5 h-2.5 rounded-full bg-purple-500 inline-block\"/> Escalated<\/span>\n            <\/div>\n            <span className=\"text-slat range11to20s / Math.max(1, totalScreened)) * 100}%` }} \n                />\n              <\/div>\n            <\/div>\n\n            <div>\n              <div className=\"flex justify-between text-xs mb-1\">\n                <span className=\"text-slate-700 font-medium\">21\u201330 seconds (Quick Resolution / Warm Transfer)<\/span>\n                <span className=\"font-mono text-slate-500\">{range21to30s} calls<\/span>\n              <\/div>\n              <div className=\"h-2 w-full bg-slate-100 rounded-full overflow-hidden\">\n                <div \n                  className=\"h-full bg-indigo-500 rounded-full\" \n                  style={{ width: `${(range21to30s / Math.max(1, totalScreened)) * 100}%` }} \n                />\n              <\/div>\n            <\/div>\n\n            <div>\n              <div className=\"flex justify-between text-xs mb-1\">\n                <span className=\"text-slate-700 font-medium\">&gt;30 seconds (Standard Call Baseline)<\/span>\n                <span className=\"font-mono text-slate-500\">{over30s} calls<\/span>\n              <\/div>\n              <div className=\"h-2 w-full bg-slate-100 rounded-full overflow-hidden\">\n                <div \n                  className=\"h-full bg-emerald-500 rounded-full\" \n                  style={{ width: `${(over30s / Math.max(1, totalScreened)) * 100}%` }} \n                />\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        {/* Audio Quality Breakdown */}\n        <div className=\"bg-white border border-slate-200 rounded-lg p-6 space-y-4\">\n          <div>\n            <h3 className=\"text-sm font-semibold text-slate-900\">\n              Audio Telephony Degradation Categories\n            <\/h3>\n            <p className=\"text-xs text-slate-500 mt-0.5\">\n              Breakdown of acoustic vs network infrastructure issues\n            <\/p>\n          <\/div>\n\n          <div className=\"space-y-3 pt-2 text-xs\">\n            <di
